<!doctype html>
<html><head><meta charset="utf-8">
<title>Dcard game reel</title>
<style>
@font-face{font-family:"Anton";src:url(assets/fonts/Anton-400-latin.woff2) format("woff2");font-display:block}
@font-face{font-family:"Anton";src:url(assets/fonts/Anton-400-latin-ext.woff2) format("woff2");unicode-range:U+0100-024F,U+02B0-02FF,U+1E00-1EFF;font-display:block}
@font-face{font-family:"Inter";src:url(assets/fonts/Inter-800-latin.woff2) format("woff2");font-weight:800;font-display:block}
@font-face{font-family:"Inter";src:url(assets/fonts/Inter-800-latin-ext.woff2) format("woff2");font-weight:800;unicode-range:U+0100-024F,U+02B0-02FF,U+1E00-1EFF;font-display:block}
@font-face{font-family:"Chakra";src:url(assets/fonts/ChakraPetch-600-latin.woff2) format("woff2");font-weight:600;font-display:block}
@font-face{font-family:"Chakra";src:url(assets/fonts/ChakraPetch-600-latin-ext.woff2) format("woff2");font-weight:600;unicode-range:U+0100-024F,U+02B0-02FF,U+1E00-1EFF;font-display:block}
@font-face{font-family:"Chakra";src:url(assets/fonts/ChakraPetch-700-latin.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Chakra";src:url(assets/fonts/ChakraPetch-700-latin-ext.woff2) format("woff2");font-weight:700;unicode-range:U+0100-024F,U+02B0-02FF,U+1E00-1EFF;font-display:block}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Dcard x kompyuter klublari — game-style reel. Every pixel is a function of t (seek-order independent).
const W=1080,H=1920;
const BLUE='#00ADFF',YEL='#FFE900',RED='#ff3d55',MAG='#ff2bd6',BG='#05070d';
const T={boot:0,hud:1.0,plate1:1.15,aim1:1.25,shot1:2.0,plate2:2.4,aim2:2.6,shot2:3.0,head1:3.35,head2:3.7,zoom:4.35,
  pad:4.7,b1:5.15,b2:5.65,b3:6.15,combo:6.6,padOut:7.25,
  phone:7.4,lock:7.7,scan:8.05,done:8.75,loot:8.85,pick1:9.15,pick2:9.4,phoneOut:10.35,
  win:10.5,band:10.55,mvp:11.0,rows:[11.3,11.55,11.8],winOut:12.55,
  logo:12.75,land:12.95,word:13.15,tag:13.5,cta:14.0,os:14.15,disc:14.25,dur:16.0};
const DUR=T.dur;

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,s,d)=>clamp((t-s)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const ease={expoOut:k=>k>=1?1:1-Math.pow(2,-10*k),expoIn:k=>k<=0?0:Math.pow(2,10*k-10),
  cubicOut:k=>1-Math.pow(1-k,3),cubicIn:k=>k*k*k,inOut:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  backOut:k=>{const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)}};
function spring(t,f=2.4,z=.5){if(t<=0)return 0;const w=2*Math.PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IM={};

// ---------------------------------------------------------------- drawing helpers
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function F(w,s,f){return `${w} ${s}px "${f}"`}
function txt(s,x,y,size,fam,o={}){ctx.save();ctx.globalAlpha*=o.alpha??1;ctx.font=F(o.w??700,size,fam);ctx.letterSpacing=(o.ls??0)+'px';
  ctx.textAlign=o.al??'center';ctx.textBaseline=o.base??'middle';ctx.fillStyle=o.col??'#fff';
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.gb??30}ctx.fillText(s,x,y);ctx.restore()}
function tw(s,size,fam,w=700,ls=0){ctx.save();ctx.font=F(w,size,fam);ctx.letterSpacing=ls+'px';const v=ctx.measureText(s).width;ctx.restore();return v}
// RGB-split slam text: amt = pixel offset of the red/cyan copies
function gtxt(s,x,y,size,fam,col,amt,o={}){if(amt>0.3){ctx.save();ctx.globalCompositeOperation='lighter';
  txt(s,x-amt,y,size,fam,{...o,col:'rgba(255,40,80,.85)'});txt(s,x+amt,y+amt*.25,size,fam,{...o,col:'rgba(0,200,255,.85)'});ctx.restore()}
  txt(s,x,y,size,fam,{...o,col})}
function star(x,y,r,col,a=1){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fill();ctx.restore()}
function check(x,y,s,k,col,lw){if(k<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  const pts=[[-.5,0],[-.15,.35],[.55,-.4]];const L1=Math.hypot(.35,.35),L2=Math.hypot(.7,.75),tot=(L1+L2)*k;
  ctx.beginPath();ctx.moveTo(x+pts[0][0]*s,y+pts[0][1]*s);
  if(tot<=L1){const q=tot/L1;ctx.lineTo(x+lerp(pts[0][0],pts[1][0],q)*s,y+lerp(pts[0][1],pts[1][1],q)*s)}
  else{ctx.lineTo(x+pts[1][0]*s,y+pts[1][1]*s);const q=(tot-L1)/L2;ctx.lineTo(x+lerp(pts[1][0],pts[2][0],q)*s,y+lerp(pts[1][1],pts[2][1],q)*s)}
  ctx.stroke();ctx.restore()}
function flash(a,col='#fff'){if(a<=0)return;ctx.save();ctx.globalAlpha=clamp(a);ctx.fillStyle=col;ctx.fillRect(0,0,W,H);ctx.restore()}
// camera shake: decaying impulses
const KICKS=[[T.shot1,16],[T.shot2,16],[T.head2,10],[T.b1,6],[T.b2,6],[T.b3,6],[T.combo,13],[T.done,9],[T.band+.05,12],[T.land,18]];
function shake(t){let x=0,y=0;for(const[k,a]of KICKS){const d=t-k;if(d<0||d>.6)continue;const e=a*Math.exp(-d*11);x+=e*Math.sin(d*93);y+=e*Math.cos(d*71)}return[x,y]}

// ---------------------------------------------------------------- shared backdrops
let SCAN;
function overlays(){ctx.drawImage(SCAN,0,0);
  const g=ctx.createRadialGradient(540,960,500,540,960,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
// computer-club room in perspective: grid floor, ceiling, rows of glowing monitors on both walls
function room(t,ox,oy,dim=1){
  const f=900,cx=540+ox,cy=900+oy,cam=t*1.6;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070a18');g.addColorStop(.47,'#0b1230');g.addColorStop(1,'#04050b');ctx.fillStyle=g;ctx.fillRect(-200,-200,W+400,H+400);
  const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,520);glow.addColorStop(0,'rgba(0,173,255,.35)');glow.addColorStop(1,'rgba(0,173,255,0)');ctx.fillStyle=glow;ctx.fillRect(-200,-200,W+400,H+400);
  const pr=(X,Y,Z)=>{const z=Z-cam;return[cx+X*f/z,cy+Y*f/z,z]};
  ctx.save();ctx.globalAlpha=dim;ctx.lineWidth=2;
  // floor + ceiling long lines
  for(let X=-6;X<=6;X++){for(const[Y,col]of[[3,'0,173,255'],[-4,'255,43,214']]){const a=pr(X,Y,cam+.6),b=pr(X,Y,cam+40);
    const lg=ctx.createLinearGradient(a[0],a[1],b[0],b[1]);lg.addColorStop(0,`rgba(${col},.55)`);lg.addColorStop(1,`rgba(${col},0)`);ctx.strokeStyle=lg;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}}
  // cross lines
  for(let k=0;k<26;k++){const Z=Math.ceil(cam/1.5)*1.5+k*1.5,z=Z-cam;if(z<.6)continue;const al=clamp(1-z/34)*.5;
    for(const[Y,col]of[[3,'0,173,255'],[-4,'255,43,214']]){const a=pr(-6,Y,Z),b=pr(6,Y,Z);ctx.strokeStyle=`rgba(${col},${al*(Y<0?.5:1)})`;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}}
  // monitors, far to near
  const pal=[BLUE,YEL,MAG,'#7a5cff',BLUE,'#22e3a6'];
  const mons=[];for(let i=0;i<14;i++){const Z=2+i*2.6;if(Z-cam<.5)continue;for(const s of[-1,1])mons.push([Z,s,i])}
  mons.sort((a,b)=>b[0]-a[0]);
  for(const[Z,s,i]of mons){const X=s*5.4,z=Z-cam,fog=clamp(1-z/30);if(fog<=0)continue;
    const c=pal[(i*2+(s>0?1:0))%pal.length],fl=.75+.25*Math.sin(t*7+i*1.7+s);
    const q=[pr(X,-.3,Z),pr(X,-.3,Z+1.6),pr(X,1.0,Z+1.6),pr(X,1.0,Z)];
    ctx.save();ctx.globalAlpha=dim*fog*fl;ctx.shadowColor=c;ctx.shadowBlur=40*fog;ctx.fillStyle=c;ctx.beginPath();q.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=dim*fog*.55;ctx.fillStyle='#000';const m=[pr(X,-.18,Z+.12),pr(X,-.18,Z+1.48),pr(X,.88,Z+1.48),pr(X,.88,Z+.12)];
    ctx.beginPath();m.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();
    // desk edge
    const d1=pr(X*.93,1.35,Z-.3),d2=pr(X*.93,1.35,Z+1.9);ctx.globalAlpha=dim*fog*.8;ctx.strokeStyle=c;ctx.lineWidth=3*fog+1;ctx.beginPath();ctx.moveTo(d1[0],d1[1]);ctx.lineTo(d2[0],d2[1]);ctx.stroke();ctx.restore()}
  // neon strips along the walls
  for(const s of[-1,1]){const a=pr(s*6,-3.3,cam+.6),b=pr(s*6,-3.3,cam+40);const lg=ctx.createLinearGradient(a[0],a[1],b[0],b[1]);lg.addColorStop(0,s<0?'rgba(255,43,214,.95)':'rgba(0,173,255,.95)');lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save();ctx.strokeStyle=lg;ctx.lineWidth=10;ctx.shadowColor=s<0?MAG:BLUE;ctx.shadowBlur=30;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore()}
  ctx.restore()}
function darkBG(gl='rgba(0,173,255,.28)',cy=900){ctx.fillStyle=BG;ctx.fillRect(-200,-200,W+400,H+400);const g=ctx.createRadialGradient(540,cy,0,540,cy,900);g.addColorStop(0,gl);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(-200,-200,W+400,H+400)}
function floorGrid(t,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='rgba(0,173,255,.5)';ctx.lineWidth=2;const cy=1250,f=700;
  for(let X=-10;X<=10;X++){ctx.beginPath();ctx.moveTo(540+X*f/1.2*.6,cy+1.6*f/1.2);ctx.lineTo(540+X*f/30*.6,cy+1.6*f/30);ctx.stroke()}
  for(let k=0;k<16;k++){const z=1.2+((k*1.4-t*1.2)%22+22)%22;const y=cy+1.6*f/z;ctx.globalAlpha=alpha*clamp(1-z/22);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}

// ---------------------------------------------------------------- S0 boot: "match found"
function sBoot(t){darkBG('rgba(0,173,255,.22)',960);floorGrid(t,.5);
  const k=ease.expoOut(P(t,0,.35)),sc=lerp(.85,1,k);ctx.save();ctx.translate(540,930);ctx.scale(sc,sc);ctx.globalAlpha=k;
  ctx.fillStyle='rgba(8,14,30,.85)';rr(-420,-250,840,500,28);ctx.fill();ctx.strokeStyle='rgba(0,173,255,.6)';ctx.lineWidth=3;ctx.stroke();
  // corner ticks
  ctx.strokeStyle=YEL;ctx.lineWidth=6;for(const[sx,sy]of[[-1,-1],[1,-1],[-1,1],[1,1]]){ctx.beginPath();ctx.moveTo(sx*420,sy*(250-60));ctx.lineTo(sx*420,sy*250);ctx.lineTo(sx*(420-60),sy*250);ctx.stroke()}
  txt('REJIM: KOMPYUTER KLUBI',0,-160,40,'Chakra',{w:600,col:BLUE,ls:6});
  const g=Math.max(0,1-P(t,.05,.3))*14;gtxt('O‘YIN TOPILDI',0,-60,104,'Chakra','#fff',g,{w:700});
  // accept button fills
  const fill=ease.inOut(P(t,.15,.45)),press=t>.6?1-.06*Math.exp(-(t-.6)*14)*Math.cos((t-.6)*30):1;
  ctx.save();ctx.scale(press,press);ctx.fillStyle='rgba(0,173,255,.18)';rr(-300,60,600,120,60);ctx.fill();ctx.save();ctx.clip();ctx.fillStyle=BLUE;ctx.fillRect(-300,60,600*fill,120);ctx.restore();
  ctx.strokeStyle=BLUE;ctx.lineWidth=4;rr(-300,60,600,120,60);ctx.stroke();txt('QABUL QILISH',0,122,52,'Chakra',{col:'#fff',ls:4});ctx.restore();ctx.restore();
  flash(P(t,.62,.3)*1.1)}

// ---------------------------------------------------------------- S1 FPS HUD
const P1={x:250,y:-170},P2={x:-280,y:-30};
function aim(t){const k1=spring(t-T.aim1,1.5,.72),k2=spring(t-T.aim2,2.6,.62);
  const ax=lerp(P1.x,P2.x,k2)*k1,ay=lerp(P1.y,P2.y,k2)*k1;
  let rx=0,ry=0;for(const s of[T.shot1,T.shot2]){const d=t-s;if(d>0){ry+=46*Math.exp(-d*9)*Math.sin(Math.min(d*18,Math.PI/2)+0)*(d<.08?d/.08:1);rx+=10*Math.exp(-d*9)}}
  return[-ax+rx,-ay+ry]}
function shardsFor(seed){const out=[];for(let i=0;i<5;i++)for(let j=0;j<3;j++){const x0=-190+i*76,y0=-70+j*47,id=seed*100+i*3+j;
  const poly=[[x0+rnd(id)*12,y0+rnd(id+1)*10],[x0+76-rnd(id+2)*12,y0+rnd(id+3)*8],[x0+76-rnd(id+4)*10,y0+47-rnd(id+5)*10],[x0+rnd(id+6)*10,y0+47-rnd(id+7)*8]];
  const cx=x0+38,cy=y0+23;out.push({poly,cx,cy,vx:cx*5+(rnd(id+8)-.5)*700,vy:-350-rnd(id+9)*700+cy*3,vr:(rnd(id+10)-.5)*14})}return out}
const SH1=shardsFor(1),SH2=shardsFor(2);
function plateShape(){ctx.beginPath();ctx.moveTo(-190,-70);ctx.lineTo(160,-70);ctx.lineTo(190,-40);ctx.lineTo(190,70);ctx.lineTo(-160,70);ctx.lineTo(-190,40);ctx.closePath()}
function plate(t,x,y,label,tIn,tHit,sh){if(t<tIn)return;const d=t-tHit;
  if(d<0){const s=spring(t-tIn,2.2,.45),bob=Math.sin(t*3+x)*6;ctx.save();ctx.translate(x,y+bob);ctx.scale(s,s);
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-120,-70);ctx.lineTo(-120,-900);ctx.moveTo(120,-70);ctx.lineTo(120,-900);ctx.stroke();
    plateShape();const g=ctx.createLinearGradient(0,-70,0,70);g.addColorStop(0,'#ff5a6e');g.addColorStop(1,'#c3122c');ctx.fillStyle=g;ctx.shadowColor=RED;ctx.shadowBlur=50;ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=4;ctx.stroke();txt(label,0,4,56,'Chakra',{col:'#fff',ls:2});ctx.restore();return}
  if(d>1.2)return;const g=2600;ctx.save();ctx.translate(x,y);
  for(const s of sh){const px=s.vx*d,py=s.vy*d+.5*g*d*d,r=s.vr*d;ctx.save();ctx.translate(s.cx+px,s.cy+py);ctx.rotate(r);ctx.globalAlpha=clamp(1-d/1.1);
    ctx.fillStyle=rnd(s.cx+s.cy)>.5?'#ff5a6e':'#c3122c';ctx.beginPath();s.poly.forEach((p,j)=>{const X=p[0]-s.cx,Y=p[1]-s.cy;j?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.closePath();ctx.fill();ctx.restore()}
  // sparks
  if(d<.3){ctx.strokeStyle=`rgba(255,233,0,${1-d/.3})`;ctx.lineWidth=5;for(let i=0;i<18;i++){const a=rnd(i+tHit*10)*Math.PI*2,r0=30+d*900,r1=r0+90*(1-d/.3);ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.stroke()}}
  ctx.restore()}
function crosshair(t){let sp=0;for(const s of[T.shot1,T.shot2]){const d=t-s;if(d>0)sp+=34*Math.exp(-d*10)}const gap=18+sp,L=36;
  ctx.save();ctx.translate(540,900);for(const[c,w]of[['rgba(0,0,0,.8)',12],[YEL,6]]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='butt';ctx.beginPath();
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){ctx.moveTo(dx*gap,dy*gap);ctx.lineTo(dx*(gap+L),dy*(gap+L))}ctx.stroke()}
  ctx.fillStyle=YEL;ctx.fillRect(-4,-4,8,8);
  for(const s of[T.shot1,T.shot2]){const d=t-s-.03;if(d<0||d>.32)continue;const a=1-d/.32,sc=1+.4*Math.exp(-d*20);ctx.save();ctx.scale(sc,sc);ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=7;ctx.beginPath();
    for(const[dx,dy]of[[1,1],[-1,1],[1,-1],[-1,-1]]){ctx.moveTo(dx*26,dy*26);ctx.lineTo(dx*58,dy*58)}ctx.stroke();ctx.restore()}
  ctx.restore()}
function muzzle(t){for(const s of[T.shot1,T.shot2]){const d=t-s;if(d<0||d>.14)continue;const a=1-d/.14;
  const g=ctx.createRadialGradient(930,1720,0,930,1720,520);g.addColorStop(0,`rgba(255,240,180,${.9*a})`);g.addColorStop(.3,`rgba(255,160,40,${.5*a})`);g.addColorStop(1,'rgba(255,120,0,0)');ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(930,1720,520,0,7);ctx.fill();ctx.restore();
  if(d<.07){ctx.save();ctx.strokeStyle=`rgba(255,240,170,${1-d/.07})`;ctx.lineWidth=8;ctx.shadowColor=YEL;ctx.shadowBlur=30;ctx.beginPath();ctx.moveTo(900,1700);ctx.lineTo(560,920);ctx.stroke();ctx.restore()}}}
const FEED=[{t:T.shot1+.08,v:'TO‘LIQ NARX'},{t:T.shot2+.08,v:'QIMMAT SOAT'}];
function killfeed(t,a){const live=FEED.filter(e=>t>=e.t);live.forEach((e,i)=>{const idx=live.length-1-i,k=ease.expoOut(P(t,e.t,.35)),slot=ease.expoOut(P(t,live[live.length-1].t,.3));
  const y=380+(idx>0?lerp(idx-1,idx,slot):0)*92;const s1=tw('SIZ',40,'Chakra'),s2=tw(e.v,40,'Chakra'),w=s1+s2+150;const x=1040-w+(1-k)*700;
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(0,0,0,.6)';rr(x,y,w,72,8);ctx.fill();ctx.strokeStyle=RED;ctx.lineWidth=3;ctx.stroke();
  txt('SIZ',x+24,y+38,40,'Chakra',{al:'left',col:BLUE});
  const ix=x+24+s1+46;ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(ix,y+36,16,0,Math.PI*2);ctx.moveTo(ix-26,y+36);ctx.lineTo(ix+26,y+36);ctx.moveTo(ix,y+10);ctx.lineTo(ix,y+62);ctx.stroke();
  txt(e.v,ix+44,y+38,40,'Chakra',{al:'left',col:RED});ctx.restore()})}
function hudFrame(t,a){if(a<=0)return;const k=ease.expoOut(P(t,T.hud,.45));ctx.save();ctx.globalAlpha=a;
  // radar
  ctx.save();ctx.translate(150-(1-k)*300,350);ctx.fillStyle='rgba(0,10,25,.65)';ctx.beginPath();ctx.arc(0,0,105,0,7);ctx.fill();ctx.strokeStyle='rgba(0,173,255,.7)';ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle='rgba(0,173,255,.3)';ctx.beginPath();ctx.arc(0,0,60,0,7);ctx.moveTo(-105,0);ctx.lineTo(105,0);ctx.moveTo(0,-105);ctx.lineTo(0,105);ctx.stroke();
  const sw=t*3.2;const sg=ctx.createConicGradient(sw,0,0);sg.addColorStop(0,'rgba(0,173,255,.5)');sg.addColorStop(.12,'rgba(0,173,255,0)');sg.addColorStop(1,'rgba(0,173,255,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,103,0,7);ctx.fill();
  for(const[bx,by,hit]of[[48,-40,T.shot1],[-52,-14,T.shot2]]){if(t<hit){ctx.fillStyle=RED;ctx.beginPath();ctx.arc(bx,by,9,0,7);ctx.fill()}}
  ctx.fillStyle=YEL;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(10,10);ctx.lineTo(-10,10);ctx.fill();ctx.restore();

    txt('Dcard’ni yuklab oling',0,3,50,'Inter',{w:800});ctx.restore()}
  if(t>=T.os)txt('iOS va Android uchun',540,1462,40,'Chakra',{w:600,col:'rgba(255,255,255,.7)',alpha:ease.cubicOut(P(t,T.os,.4))});
  if(t>=T.disc)txt('Chegirma va bonuslar hamkorning amaldagi taklif shartlariga bog‘liq.',540,1545,25,'Inter',{w:800,col:'rgba(255,255,255,.5)',alpha:ease.cubicOut(P(t,T.disc,.4))});
  flash((1-P(t,T.logo,.2))*.6)}

function draw(t){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);const[sx,sy]=shake(t);ctx.translate(sx,sy);
  if(t<T.hud)sBoot(t);
  else if(t<T.pad){const z=ease.expoIn(P(t,T.zoom,.35));if(z>0){ctx.save();ctx.translate(540,900);ctx.scale(1+z*7,1+z*7);ctx.translate(-540,-900);sHud(t);ctx.restore()}else sHud(t);flash(P(t,T.zoom+.15,.2))}
  else if(t<T.padOut+.12){const z=ease.expoOut(P(t,T.pad,.45));const wp=ease.expoIn(P(t,T.padOut,.12));ctx.save();ctx.translate(540-wp*1300,960);ctx.scale(lerp(.55,1,z),lerp(.55,1,z));ctx.translate(-540,-960);sPad(t);ctx.restore()}
  else if(t<T.win)sPhone(t);
  else if(t<T.logo)sWin(t);
  else sLogo(t);
  ctx.setTransform(1,0,0,1,0,0);overlays()}

function loadImg(src,w,h){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;if(w){i.width=w;i.height=h}})}
function getText(url){return new Promise((r,j)=>{const x=new XMLHttpRequest();x.open('GET',url);x.onload=()=>r(x.responseText);x.onerror=j;x.send()})}
async function svgImg(url,size){const s=await getText(url);const fixed=s.replace(/width="\d+"/,`width="${size}"`).replace(/height="\d+"/,`height="${size}"`);return loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(fixed))}

  SCAN=document.createElement('canvas');SCAN.width=W;SCAN.height=H;const s=SCAN.getContext('2d');s.fillStyle='rgba(0,0,0,.07)';for(let y=0;y<H;y+=4)s.fillRect(0,y,W,2);
  draw(0);return true})();
