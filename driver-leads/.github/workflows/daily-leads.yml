name: Daily FMCSA leads

on:
  schedule:
    - cron: "17 11 * * *"   # every day 11:17 UTC
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch yesterday's new owner-operators
        run: python scripts/fetch_fmcsa_leads.py --days 2
      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: data/*.csv
          retention-days: 14
