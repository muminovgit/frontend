<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Ofis</title>
  <style>
    :root {
      --bg: #e9e4da; --floor: #f4efe6; --ink: #2b2b33; --muted: #7a7a85;
      --card: #ffffff; --line: #d9d2c3;
      --work: #3b82f6; --wait: #f59e0b; --done: #22c55e; --err: #ef4444; --idle: #9ca3af;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      justify-content: space-between; padding: 14px 16px; }
    header h1 { font-size: 1.1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--done);
      box-shadow: 0 0 0 4px #22c55e33; animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px #22c55e00; } }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 6px 12px; min-width: 92px; }
    .stat b { display: block; font-size: 1.25rem; }
    .stat span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .controls { display: flex; gap: 8px; align-items: center; font-size: .85rem; }
    button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    button:hover { border-color: #aaa; }
    button.ok { background: var(--done); color: #fff; border-color: var(--done); }
    button.no { background: var(--err); color: #fff; border-color: var(--err); }

    main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 12px; padding: 0 16px 16px; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
    #wrap { background: var(--floor); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; position: relative; }
    #stage { position: relative; width: 960px; height: 600px; transform-origin: 0 0;
      background:
        linear-gradient(#0000000a 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, #0000000a 1px, transparent 1px) 0 0 / 40px 40px, var(--floor); }
    #belt { position: absolute; left: 40px; right: 40px; top: 205px; height: 22px; border-radius: 11px;
      background: repeating-linear-gradient(90deg, #4b5563 0 18px, #565e6b 18px 36px);
      animation: belt 1.2s linear infinite; opacity: .85; }
    @keyframes belt { to { background-position: 36px 0; } }
    .zone { position: absolute; font-size: .65rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

    .desk { position: absolute; width: 150px; margin-left: -75px; text-align: center; }
    .desk .top { background: #c8a27a; border: 2px solid #a8814f; border-radius: 8px; height: 46px;
      position: relative; box-shadow: 0 4px 0 #a8814f55; }
    .desk .mon { position: absolute; left: 50%; top: -22px; width: 54px; height: 34px; margin-left: -27px;
      background: #111827; border: 3px solid #374151; border-radius: 4px; overflow: hidden; }
    .desk .mon i { display: block; height: 3px; margin: 4px 4px 0; background: #38bdf8; opacity: .0; border-radius: 2px; }
    .desk.working .mon i { opacity: .9; animation: type 1s steps(2) infinite; }
    .desk.working .mon i:nth-child(2) { animation-delay: .3s; width: 60%; }
    .desk.working .mon i:nth-child(3) { animation-delay: .6s; width: 40%; }
    @keyframes type { 50% { opacity: .2; } }
    .desk .label { margin-top: 6px; font-size: .75rem; font-weight: 600; }
    .desk .task { font-size: .65rem; color: var(--muted); min-height: 1.6em; line-height: 1.2; }
    .desk .bar { height: 5px; border-radius: 3px; background: #0000001a; margin: 4px 14px 0; overflow: hidden; }
    .desk .bar div { height: 100%; width: 0; background: var(--work); transition: width .3s; }

    .agent { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
      display: grid; place-items: center; font-size: 22px; background: var(--card); border: 3px solid var(--idle);
      transition: left 1.4s ease-in-out, top 1.4s ease-in-out, border-color .3s; z-index: 5; }
    .agent.working { border-color: var(--work); }
    .agent.walking { border-color: var(--wait); }
    .agent.waiting { border-color: var(--wait); animation: bob 1s ease-in-out infinite; }
    .agent.done { border-color: var(--done); }
    .agent.error { border-color: var(--err); }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    .agent .bubble { position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff; font-size: .65rem; padding: 2px 6px; border-radius: 6px; white-space: nowrap;
      opacity: 0; transition: opacity .25s; pointer-events: none; }
    .agent.show .bubble { opacity: 1; }

    #human { position: absolute; left: 480px; top: 520px; width: 230px; margin-left: -115px; text-align: center; }
    #human .top { background: #c8a27a; border: 2px solid #a8814f; border-radius: 8px; height: 50px; position: relative;
      box-shadow: 0 4px 0 #a8814f55; }
    #human .m { position: absolute; top: -26px; width: 60px; height: 38px; background: #111827;
      border: 3px solid #374151; border-radius: 4px; }
    #human .m:nth-child(1) { left: 14px; } #human .m:nth-child(2) { left: 85px; } #human .m:nth-child(3) { left: 156px; }
    #me { position: absolute; left: 480px; top: 474px; font-size: 34px; margin: -22px 0 0 -17px; z-index: 4; }
    #queue { position: absolute; left: 480px; top: 362px; max-height: 108px; overflow-y: auto; width: 250px; margin-left: -125px;
      background: var(--card); border: 2px dashed var(--wait); border-radius: 10px; padding: 6px 8px; font-size: .72rem; }
    #queue h4 { margin: 0 0 4px; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--wait); }
    .qi { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-top: 1px solid var(--line); }
    .qi span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qi button { padding: 1px 7px; font-size: .75rem; }
    #queue .empty { color: var(--muted); padding: 4px 0; }

    aside { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
      max-height: 640px; overflow: auto; }
    aside h3 { margin: 0 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    #log { list-style: none; padding: 0; margin: 0; font-size: .78rem; }
    #log li { padding: 5px 0; border-top: 1px solid var(--line); display: flex; gap: 6px; }
    #log time { color: var(--muted); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1><span class="dot"></span> Agent Ofis <small style="color:var(--muted);font-weight:400">24/7</small></h1>
    <div class="stats">
      <div class="stat"><b id="sShipped">0</b><span>Tayyor</span></div>
      <div class="stat"><b id="sActive">0</b><span>Ishlayapti</span></div>
      <div class="stat"><b id="sQueue">0</b><span>Tasdiq kutmoqda</span></div>
      <div class="stat"><b id="sErr">0</b><span>Xato</span></div>
    </div>
    <div class="controls">
      <label><input type="checkbox" id="auto"> Avto-tasdiq</label>
      <button id="pause">⏸ Pauza</button>
    </div>
  </header>

  <main>
    <div id="wrap"><div id="stage">
      <div id="belt"></div>
      <div class="zone" style="left:420px;top:232px">Vazifalar oqimi →</div>
      <div id="queue"><h4>👤 Tasdiq navbati</h4><div id="qlist"></div></div>
      <div id="me">🧑‍💻</div>
      <div id="human"><div class="top"><div class="m"></div><div class="m"></div><div class="m"></div></div>
        <div style="font-size:.75rem;font-weight:600;margin-top:6px">Siz (Boss)</div></div>
    </div></div>
    <aside><h3>Jonli log</h3><ul id="log"></ul></aside>
  </main>

<script>
/* ---- Sozlamalar: agentlarni shu yerda o'zgartiring ---- */
const AGENTS = [
  { id: 'research', name: 'Tadqiqotchi', emoji: '🔎', x: 150, y: 90,  tasks: ['Bozor tahlili', 'Raqobatchilar', 'Trend qidiruv'] },
  { id: 'writer',   name: 'Kontent',     emoji: '✍️', x: 480, y: 90,  tasks: ['Blog post', 'Email kampaniya', 'Reels ssenariy'] },
  { id: 'sales',    name: 'Sotuv',       emoji: '💰', x: 810, y: 90,  tasks: ['Lead topish', 'Taklif yuborish', 'Follow-up'] },
  { id: 'coder',    name: 'Dasturchi',   emoji: '🤖', x: 150, y: 290, tasks: ['Bug fix', 'Yangi funksiya', 'Code review'] },
  { id: 'support',  name: 'Support',     emoji: '🎧', x: 810, y: 290, tasks: ['Ticket javob', 'FAQ yangilash', 'Shikoyat'] },
];
const QUEUE_POS = { x: 480, y: 335 };

/* ---- Holat ---- */
const stage = document.getElementById('stage');
const S = { shipped: 0, err: 0, queue: [], paused: false, a: {} };
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function log(text, icon = '•') {
  const li = document.createElement('li');
  const t = new Date().toLocaleTimeString('uz', { hour12: false });
  li.innerHTML = `<time>${t}</time><span>${icon} ${text}</span>`;
  $('log').prepend(li);
  while ($('log').children.length > 60) $('log').lastChild.remove();
}

/* ---- Agentlarni chizish ---- */
AGENTS.forEach(def => {
  const desk = document.createElement('div');
  desk.className = 'desk'; desk.style.left = def.x + 'px'; desk.style.top = def.y + 'px';
  desk.innerHTML = `<div class="top"><div class="mon"><i></i><i></i><i></i></div></div>
    <div class="label">${def.name}</div><div class="task">kutmoqda</div><div class="bar"><div></div></div>`;
  stage.appendChild(desk);
  const el = document.createElement('div');
  el.className = 'agent'; el.innerHTML = `${def.emoji}<span class="bubble"></span>`;
  stage.appendChild(el);
  const st = { def, desk, el, state: 'idle', task: null, progress: 0, home: { x: def.x, y: def.y - 48 }, pending: null };
  S.a[def.id] = st;
  place(st, st.home);
});

function place(st, p) { st.el.style.left = p.x + 'px'; st.el.style.top = p.y + 'px'; }
function say(st, text, ms = 2200) {
  const b = st.el.querySelector('.bubble'); b.textContent = text; st.el.classList.add('show');
  clearTimeout(st._bt); st._bt = setTimeout(() => st.el.classList.remove('show'), ms);
}
function setState(st, state, taskText) {
  st.state = state;
  st.el.className = 'agent ' + state + (st.el.classList.contains('show') ? ' show' : '');
  st.desk.classList.toggle('working', state === 'working');
  if (taskText !== undefined) st.desk.querySelector('.task').textContent = taskText;
  render();
}
function setProgress(st, v) { st.progress = v; st.desk.querySelector('.bar div').style.width = (v * 100) + '%'; }

/* ---- Hodisalar API (haqiqiy agentlarni ulash uchun) ---- */
const API = {
  start(id, task)    { const st = S.a[id]; if (!st) return; st.task = task; setProgress(st, 0); setState(st, 'working', task); say(st, 'Boshladim'); log(`${st.def.name}: «${task}» boshlandi`, '▶️'); },
  progress(id, v)    { const st = S.a[id]; if (st) setProgress(st, v); },
  needApproval(id, task, e) {
    const st = S.a[id]; if (!st) return;
    if (task && e) st.task = task;
    const item = { id: (e && e.itemId) || Date.now() + Math.random(), agent: id, task: st.task || 'vazifa' };
    S.queue.push(item); st.pending = item;
    setState(st, 'walking'); const slot = S.queue.length - 1;
    place(st, { x: QUEUE_POS.x - 90 + (slot % 5) * 45, y: QUEUE_POS.y + Math.floor(slot / 5) * 40 });
    setTimeout(() => { if (st.pending === item) { setState(st, 'waiting'); say(st, 'Tasdiq kerak!', 4000); } }, 1400);
    log(`${st.def.name}: «${st.task}» tasdiq kutmoqda`, '🙋');
  },
  decide(itemId, ok) {
    const i = S.queue.findIndex(q => q.id === itemId); if (i < 0) return;
    const [item] = S.queue.splice(i, 1); const st = S.a[item.agent]; st.pending = null;
    S.queue.forEach((q, k) => { const s = S.a[q.agent]; if (s.state === 'waiting') place(s, { x: QUEUE_POS.x - 90 + (k % 5) * 45, y: QUEUE_POS.y + Math.floor(k / 5) * 40 }); });
    place(st, st.home);
    if (ok) { S.shipped++; setState(st, 'done', 'Tayyor ✔'); say(st, 'Rahmat!'); log(`«${item.task}» tasdiqlandi`, '✅'); setTimeout(() => API.idle(st.def.id), 2500); }
    else { setProgress(st, 0.4); setState(st, 'working', item.task + ' (qayta)'); say(st, 'Qayta qilaman'); log(`«${item.task}» rad etildi`, '↩️'); st.redo = true; }
  },
  error(id, msg)     { const st = S.a[id]; if (!st) return; S.err++; setState(st, 'error', msg || 'Xato'); say(st, 'Xato!'); log(`${st.def.name}: ${msg || 'xato'}`, '⚠️'); setTimeout(() => API.idle(id), 3000); },
  done(id)           { const st = S.a[id]; if (!st) return; S.shipped++; setState(st, 'done', 'Tayyor ✔'); log(`${st.def.name}: «${st.task}» tayyor`, '✅'); setTimeout(() => API.idle(id), 2000); },
  idle(id)           { const st = S.a[id]; if (!st) return; st.task = null; setProgress(st, 0); setState(st, 'idle', 'kutmoqda'); },
  event(e)           {
    if (e.type === 'decide') return API.decide(e.itemId, e.ok);
    const f = API[e.type]; if (f && e.agent) f.call(API, e.agent, e.task ?? e.value ?? e.message, e);
  },
};
window.AgentOffice = API;

/* ---- Render ---- */
/* Jonli rejimda qaror serverga yuboriladi, server hammaga (va kutayotgan agentga) tarqatadi */
const KEY = new URLSearchParams(location.search).get('key') || '';
function choose(id, ok) {
  if (!S.live) return API.decide(id, ok);
  fetch('/decision?key=' + encodeURIComponent(KEY), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ itemId: id, ok }) });
}
function render() {
  $('sShipped').textContent = S.shipped;
  $('sErr').textContent = S.err;
  $('sQueue').textContent = S.queue.length;
  $('sActive').textContent = Object.values(S.a).filter(a => a.state === 'working').length;
  const q = $('qlist'); q.innerHTML = '';
  if (!S.queue.length) q.innerHTML = '<div class="empty">Hozircha bo\'sh 🎉</div>';
  S.queue.forEach(it => {
    const row = document.createElement('div'); row.className = 'qi';
    row.innerHTML = `<span>${S.a[it.agent].def.emoji} ${it.task}</span>`;
    const ok = Object.assign(document.createElement('button'), { textContent: '✓', className: 'ok', onclick: () => choose(it.id, true) });
    const no = Object.assign(document.createElement('button'), { textContent: '✕', className: 'no', onclick: () => choose(it.id, false) });
    row.append(ok, no); q.appendChild(row);
  });
}

/* ---- Demo simulyatsiya (haqiqiy ulanmaguncha) ---- */
function tick() {
  if (S.paused) return;
  Object.values(S.a).forEach(st => {
    if (st.state === 'idle' && Math.random() < 0.25) API.start(st.def.id, pick(st.def.tasks));
    else if (st.state === 'working') {
      const p = Math.min(1, st.progress + rnd(0.03, 0.09)); setProgress(st, p);
      if (p >= 1) {
        const r = Math.random();
        if (r < 0.07) API.error(st.def.id, 'API xatosi');
        else if (r < 0.65 && !st.redo) API.needApproval(st.def.id);
        else { st.redo = false; API.done(st.def.id); }
        st.redo = false;
      }
    }
  });
  if ($('auto').checked && S.queue.length) choose(S.queue[0].id, true);
}
setInterval(tick, 700);
$('pause').onclick = e => { S.paused = !S.paused; e.target.textContent = S.paused ? '▶ Davom' : '⏸ Pauza'; };

/* ---- Haqiqiy backend: ?ws=wss://... yoki ?sse=https://... ----
   Server shunday JSON yuborsin: {"type":"start","agent":"coder","task":"Bug fix"}
   type: start | progress | needApproval | error | done | idle */
const qs = new URLSearchParams(location.search);
/* Server.js bilan ochilganda (http://localhost:3000) avtomatik jonli rejim */
fetch('/ping').then(r => r.ok && r.json()).then(j => {
  if (!j || !j.office) return;
  S.live = true; S.paused = true; $('pause').style.display = 'none';
  const es = new EventSource('/events?key=' + encodeURIComponent(KEY)); es.onmessage = m => API.event(JSON.parse(m.data));
  es.onopen = () => log('Serverga ulandi', '🔌');
}).catch(() => {});
if (qs.get('ws')) { S.paused = true; const ws = new WebSocket(qs.get('ws')); ws.onmessage = m => API.event(JSON.parse(m.data)); }
if (qs.get('sse')) { S.paused = true; const es = new EventSource(qs.get('sse')); es.onmessage = m => API.event(JSON.parse(m.data)); }

/* ---- Ekranga moslash ---- */
function fit() { const w = $('wrap').clientWidth, k = Math.min(1, w / 960); stage.style.transform = `scale(${k})`; $('wrap').style.height = 600 * k + 'px'; }
addEventListener('resize', fit); fit();
render(); log('Ofis ochildi', '🏢');
</script>
</body>
</html>
