<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silikon Minora</title>
  <style>
    :root {
      --page: #f0ebe1; --ink: #2b2926; --muted: #7a746a; --card: #fffdf8; --line: #e1d9c8; --brand: #c9653f;
      --work: #c9653f; --wait: #e0a030; --done: #3f9a6b; --err: #c0453f;
    }
    :root[data-pal="glass"] { --page: #e9eef4; --ink: #1f2430; --muted: #6b7280; --card: #ffffff; --line: #d6dde6; --brand: #3b82f6; --work: #3b82f6; --wait: #f59e0b; --done: #22c55e; --err: #ef4444; }
    :root[data-pal="night"] { --page: #12162b; --ink: #e8ecff; --muted: #9aa5c8; --card: #1b2140; --line: #2f3860; --brand: #8aa4ff; --work: #6c8cff; --wait: #ffc15a; --done: #4fd1a5; --err: #ff6b7a; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
    header h1 { font-size: 1.1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--done); box-shadow: 0 0 0 4px #22c55e33; animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px #22c55e00; } }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; min-width: 92px; }
    .stat b { display: block; font-size: 1.25rem; }
    .stat span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .controls { display: flex; gap: 8px; align-items: center; font-size: .85rem; }
    button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    button:hover { border-color: #9aa5b5; }
    button.ok { background: var(--done); color: #fff; border-color: var(--done); } select { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 5px 8px; }
    button.no { background: var(--err); color: #fff; border-color: var(--err); }

    #taskbar { display: none; gap: 8px; padding: 0 16px 10px; flex-wrap: wrap; }
    #taskbar.on { display: flex; }
    #taskbar select, #taskbar input { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--card); color: var(--ink); }
    #taskbar input, #taskbar textarea { flex: 1; min-width: 220px; }
    #taskbar textarea { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--card); color: var(--ink); resize: vertical; min-height: 38px; max-height: 260px; line-height: 1.4; }
    #taskbar .cnt { align-self: center; font-size: .72rem; color: var(--muted); min-width: 64px; text-align: right; }
    #taskbar button { background: var(--work); color: #fff; border-color: var(--work); }

    #pipe { display: none; align-items: center; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; font-size: .8rem; }
    #pipe.on { display: flex; }
    .chip { padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
    .chip.running { border-color: var(--work); color: var(--work); animation: pulse2 1.2s infinite; }
    .chip.review { border-color: var(--wait); color: var(--wait); }
    .chip.done { border-color: var(--done); color: var(--done); }
    .chip.rejected, .chip.error { border-color: var(--err); color: var(--err); }
    .chip.skipped { opacity: .45; }
    @keyframes pulse2 { 50% { opacity: .55; } }
    #pipeInfo { color: var(--muted); margin-left: 6px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { padding: 3px 10px; border-radius: 6px; font-weight: 700; color: #fff; }
    .badge.GO { background: var(--done); } .badge.WAIT { background: var(--wait); } .badge.REJECT { background: var(--err); }

    main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; padding: 0 16px 16px; }
    @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
    #wrap { border-radius: 14px; overflow: hidden; position: relative; border: 1px solid var(--line); background: #8fc3ea; }
    #stage { position: relative; width: 1000px; height: 1090px; transform-origin: 0 0; overflow: hidden; background: #9ed8f6; }

    /* ---- shahar fon ---- */
    .citywrap { position: absolute; inset: 0; }
    .sun { position: absolute; left: 870px; top: 34px; width: 58px; height: 58px; border-radius: 50%; background: #fff3b0; box-shadow: 0 0 50px 16px #fff3b0aa; }
    .cloud { position: absolute; height: 22px; border-radius: 22px; background: #ffffffd0; animation: drift linear infinite; }
    .cloud::before { content: ''; position: absolute; left: 14px; top: -10px; width: 32px; height: 26px; border-radius: 50%; background: inherit; }
    @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(1120px); } }
    .tag { position: absolute; padding: 5px 12px 5px 9px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: #e8f6ff; background: #0d2338e8; border: 1px solid var(--tg, #37e0ff); border-radius: 3px 12px 12px 3px; z-index: 2000;
      box-shadow: 0 0 12px color-mix(in srgb, var(--tg, #37e0ff) 45%, transparent), inset 0 0 8px #37e0ff22; white-space: nowrap; }
    .tag b { color: var(--tg, #37e0ff); margin-right: 8px; }
    .pod { position: absolute; left: 0; animation: drive linear infinite; z-index: 5; }
    .pod.rev { animation-direction: reverse; } .pod.rev svg { transform: scaleX(-1); }
    @keyframes drive { from { transform: translateX(-120px); } to { transform: translateX(1100px); } }
    .ped { position: absolute; left: 0; z-index: 6; animation: stroll linear infinite; transform-origin: 0 0; }
    .ped .char { width: 40px; height: 72px; transform: scale(.62); transform-origin: 0 100%; margin-top: -45px; }
    .ped.rev { animation-direction: reverse; } .ped.rev .char { transform: scale(-.62, .62); }
    @keyframes stroll { from { transform: translateX(-60px); } to { transform: translateX(1050px); } }
    .glare { position: absolute; z-index: 1500; pointer-events: none; background: linear-gradient(115deg, #ffffff00 20%, #ffffff26 32%, #ffffff00 44%, #ffffff00 62%, #ffffff1c 70%, #ffffff00 80%); mix-blend-mode: screen; }

    /* ---- minora ---- */
    .floor { position: absolute; width: 740px; height: 140px; overflow: hidden; }
    #shaft { position: absolute; left: 840px; top: 190px; width: 60px; height: 700px; background: linear-gradient(90deg, #5a6482, #3f4766); z-index: 1; border-left: 2px solid #ffffff55; }
    .sdoor { position: absolute; width: 46px; height: 112px; border: 2px solid #9aa4be; background: linear-gradient(#2e3550, #232942); border-radius: 3px; }
    #cabin { position: absolute; left: 847px; width: 46px; height: 110px; z-index: 2; background: linear-gradient(#d7e3f3, #aebfd8); border: 2px solid #f2f6fc; border-radius: 4px; box-shadow: 0 0 12px #8fd0f066; }
    #cabin::before { content: '▲▼'; position: absolute; top: 3px; left: 0; right: 0; text-align: center; font-size: 8px; color: #2a3042; }
    .led { animation: blink 1.4s infinite; } @keyframes blink { 50% { opacity: .25; } }
    .chair { position: absolute; width: 40px; height: 64px; pointer-events: none; }
    .desk { position: absolute; height: 62px; pointer-events: none; }
    .desk .ln { opacity: .15; } .desk.work .ln { opacity: .95; animation: type 1s steps(2) infinite; } .desk.work .ln:nth-child(2) { animation-delay: .3s; } .desk.work .ln:nth-child(3) { animation-delay: .6s; }
    @keyframes type { 50% { opacity: .25; } }

    /* ---- xodimlar ---- */
    .emp { position: absolute; width: 40px; height: 72px; transform: translate(-50%, -100%); }
    .emp .char { position: relative; width: 40px; height: 72px; }
    .emp.left .char { transform: scaleX(-1); }
    .csv { display: block; overflow: visible; }
    .csv .lgL, .csv .lgR, .csv .arL, .csv .arR { transform-box: fill-box; transform-origin: 50% 6%; }
    .emp .tagbox { position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); text-align: center; white-space: nowrap; pointer-events: none; }
    .emp .nm { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; background: #1f2430d9; padding: 1px 7px; border-radius: 7px; box-shadow: 0 1px 3px #0003; }
    .emp .tk { display: block; font-size: 9px; color: #1f2430; background: #ffffffe6; border-radius: 4px; padding: 0 5px; margin-top: 1px; max-width: 124px; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 1px 3px #0002; }
    .emp .pb { display: none; height: 3px; width: 46px; margin: 2px auto 0; background: #0003; border-radius: 2px; overflow: hidden; }
    .emp .pb div { height: 100%; width: 0; background: var(--work); transition: width .3s; }
    .emp.working .pb { display: block; }
    .emp .bubble { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); background: #fff; color: #1f2430; border: 1px solid #c8d0dc; font-size: 10px; padding: 3px 8px; border-radius: 9px; max-width: 170px; width: max-content; white-space: normal; line-height: 1.25; text-align: center;
      opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 1000; box-shadow: 0 2px 6px #0002; }
    .emp.say .bubble { opacity: 1; }
    .emp.working .nm { background: var(--work); } .emp.waiting .nm { background: var(--wait); } .emp.done .nm { background: var(--done); } .emp.error .nm { background: var(--err); }
    .emp.waiting .char { animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-3px); } }
    .emp.walking .char { animation: bob2 .38s ease-in-out infinite; }
    .emp.left.walking .char { animation: bob2l .38s ease-in-out infinite; }
    @keyframes bob2 { 50% { transform: translateY(-2px); } } @keyframes bob2l { 0%,100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) translateY(-2px); } }
    .emp.walking .lgL, .emp.walking .arR, .char.walking .lgL, .char.walking .arR { animation: swingA .4s ease-in-out infinite; }
    .emp.walking .lgR, .emp.walking .arL, .char.walking .lgR, .char.walking .arL { animation: swingB .4s ease-in-out infinite; }
    @keyframes swingA { 0%,100% { transform: rotate(-24deg); } 50% { transform: rotate(24deg); } }
    @keyframes swingB { 0%,100% { transform: rotate(24deg); } 50% { transform: rotate(-24deg); } }
    .emp.typing .arL { animation: typeA .28s ease-in-out infinite; } .emp.typing .arR { animation: typeA .28s .14s ease-in-out infinite; }
    @keyframes typeA { 50% { transform: rotate(-14deg); } }
    .emp.boss .nm { background: #7c3aed; }

    /* ---- yon panel ---- */
    aside { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; max-height: 900px; overflow: auto; }
    aside h3 { margin: 12px 0 6px; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    aside h3:first-child { margin-top: 0; }
    .qi, .res, .jr { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-top: 1px solid var(--line); font-size: .78rem; }
    .qi span, .res span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qi button, .res button { padding: 1px 7px; font-size: .75rem; }
    .empty { color: var(--muted); font-size: .78rem; padding: 4px 0; }
    .res small, .jr small { color: var(--muted); display: block; white-space: normal; }
    .jr { align-items: flex-start; } .jr .badge { font-size: .65rem; padding: 2px 6px; }
    #log { list-style: none; padding: 0; margin: 0; font-size: .75rem; }
    #log li { padding: 4px 0; border-top: 1px solid var(--line); display: flex; gap: 6px; }
    #log time { color: var(--muted); font-variant-numeric: tabular-nums; }
    #modal { position: fixed; inset: 0; background: #0009; display: none; place-items: center; z-index: 5000; padding: 16px; overflow: hidden; }
    #modal.on { display: grid; }
    #modal .box { background: var(--card); border-radius: 14px; max-width: 860px; width: 100%; height: min(86vh, 980px); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px #0006; }
    #modal .mh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    #modal .mh b { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mText { flex: 1 1 auto; min-height: 0; padding: 16px 20px 28px; overflow-y: auto; word-break: break-word; font: .92rem/1.65 system-ui, sans-serif; }
    #mText h2, #mText h3, #mText h4, #mText h5 { margin: 1.3em 0 .4em; line-height: 1.25; } #mText h2 { font-size: 1.25rem; } #mText h3 { font-size: 1.08rem; } #mText h4, #mText h5 { font-size: .95rem; }
    #mText p { margin: .5em 0; } #mText ul, #mText ol { margin: .4em 0 .6em; padding-left: 1.3em; } #mText li { margin: .2em 0; }
    #mText pre { background: var(--page); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font: .8rem/1.5 ui-monospace, Menlo, monospace; white-space: pre; }
    #mText code { background: var(--page); padding: 1px 5px; border-radius: 4px; font: .85em ui-monospace, Menlo, monospace; }
    #mText table { border-collapse: collapse; margin: .6em 0; font-size: .85rem; display: block; overflow-x: auto; } #mText td, #mText th { border: 1px solid var(--line); padding: 4px 9px; } #mText th { background: var(--page); }
    #mText hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
    #mText .talkh { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 .4em; }
    #mText .talk { background: var(--page); border-left: 3px solid var(--brand); padding: 6px 10px; margin: .4em 0; font-size: .82rem; border-radius: 0 6px 6px 0; }
    body.noscroll { overflow: hidden; }
    #pipe .pdfb { margin-left: auto; font-size: .75rem; padding: 3px 10px; }
  </style>
</head>
<body>
  <header>
    <h1><span class="dot"></span> Silikon Minora <small style="color:var(--muted);font-weight:400">24/7</small></h1>
    <div class="stats">
      <div class="stat"><b id="sShipped">0</b><span>Tayyor</span></div>
      <div class="stat"><b id="sActive">0</b><span>Ishlayapti</span></div>
      <div class="stat"><b id="sQueue">0</b><span>Tasdiq kutmoqda</span></div>
      <div class="stat"><b id="sErr">0</b><span>Xato</span></div>
    </div>
    <div class="controls"><label>Rang <select id="pal"><option value="claude">Iliq</option><option value="glass">Shisha</option><option value="night">Kechki shahar</option></select></label><label><input type="checkbox" id="auto"> Avto-tasdiq</label></div>
  </header>

  <div id="taskbar">
    <select id="tAgent"></select>
    <textarea id="tText" rows="1" maxlength="30000"></textarea>
    <button id="tGo"></button>
  </div>
  <div id="pipe"></div>
  <div id="modal"><div class="box"><div class="mh"><b id="mTitle"></b><button id="mPdf" title="Chop etish oynasida «PDF sifatida saqlash» ni tanlang">📄 PDF</button><button id="mMd">⬇ .md</button><button id="mCopy">📋 Nusxa</button><button id="mClose">Yopish</button></div><div id="mText"></div></div></div>

  <main>
    <div id="wrap"><div id="stage"></div></div>
    <aside>
      <h3>Tasdiq navbati</h3><div id="qlist"></div>
      <h3 id="resH" style="display:none">Hujjatlar (saqlangan) <button id="arcAll" style="float:right;padding:0 6px;font-size:.7rem">⬇ Hammasi</button></h3><div id="results" style="max-height:320px;overflow-y:auto"></div>
      <h3 id="jrH" style="display:none">Qaror jurnali <button id="csv" style="float:right;padding:0 6px;font-size:.7rem">CSV</button></h3><div id="journal"></div>
      <h3>Jonli log</h3><ul id="log"></ul>
    </aside>
  </main>

<script>
/* ======================= O'LCHAMLAR ======================= */
const TX = 100, TY = 190, FW = 140, STAGE_H = 1090;          // minora chap/yuqori, qavat balandligi
const DOOR_X = TX + 770;                     // lift eshigi
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const Y = n => TY + (5 - n) * FW;            // qavat tepasi (n = 1..5)
const LANE = n => Y(n) + 130;                // yurish chizig'i
const SEAT = n => Y(n) + 112;                // o'tirish chizig'i
const DESK_X = [60, 210, 420];
const mk = (w0, w1, c0, c1, ac, tg) => ({ wall: [w0, w1], carpet: [c0, c1], accent: ac, tag: tg });
const PALS = {
  claude: { night: false, page: '#f0ebe1', sky: ['#d6e4ea', '#efe4d2', '#f4ead9'], far: ['#d3c7b8', '#c4b8a8'], farWin: '#fff3d6', farOp: .5, mid: ['#bcae9d', '#8f8070'], haze: '#f4ead9',
    ground: '#8d867b', walk: '#d9d1c2', walkEdge: '#b8ae9c', road: '#55514b', lobby: '#f1e9da', lobbyFloor: '#cdbfa6', slab: ['#f6f0e4', '#b9ad97'], winPane: ['#a9cfe0', '#f2e8d5'], winFar: '#b3c3cb', glow: .35, sun: '#ffe7ae',
    themes: { research: mk('#f6f0e4', '#ece2d0', '#cdb18a', '#b99a6f', '#3f8f8b', '#5fc9c2'), marketing: mk('#f8eee6', '#f0dccd', '#d3ab8c', '#bf9070', '#d9775a', '#ff9a7a'),
      sales: mk('#f8f1de', '#efe2bd', '#d3b784', '#bd9a62', '#d1963a', '#ffc058'), risk: mk('#efe9e4', '#e0d6cd', '#b5a79a', '#9d8e81', '#b5483f', '#ff7a6e'), control: mk('#efe9f2', '#e0d5e8', '#b7a3c9', '#9f89b6', '#6a62b8', '#a79cff') } },
  glass: { night: false, page: '#e9eef4', sky: ['#a9d3ee', '#d3e9f4', '#eaf4f6'], far: ['#a7c3d6', '#93b3c9'], farWin: '#ffffff', farOp: .4, mid: ['#8fb2cb', '#5c86a6'], haze: '#e8f3f6',
    ground: '#8b97a4', walk: '#d2d9e1', walkEdge: '#aab4c0', road: '#565d6a', lobby: '#e3eff6', lobbyFloor: '#b6c4d0', slab: ['#f2f6fb', '#a9b6c6'], winPane: ['#8ccaf0', '#e6f4fb'], winFar: '#9bbdd4', glow: .3, sun: '#fff0b8',
    themes: { research: mk('#eef3f8', '#dfe8f0', '#b9c9d8', '#9fb3c6', '#3b7fb0', '#6cc0f5'), marketing: mk('#f4eef3', '#e8dde6', '#c9b3c6', '#b098ad', '#b0558f', '#e88bc4'),
      sales: mk('#eef3ee', '#dfe9df', '#b3c8b6', '#98b09c', '#3f9a6b', '#6fdca0'), risk: mk('#eceef1', '#dde1e6', '#a9b2bd', '#8f9aa7', '#c0504d', '#ff8a85'), control: mk('#edeaf4', '#dfdaee', '#aaa3c9', '#9088b6', '#5a55b8', '#a9a4ff') } },
  night: { night: true, page: '#12162b', sky: ['#0b1028', '#1a2350', '#2c3566'], far: ['#252e58', '#1c2448'], farWin: '#ffd479', farOp: .7, mid: ['#1b2348', '#10162f'], haze: '#2c3566',
    ground: '#2a2f45', walk: '#3a4058', walkEdge: '#2a2f44', road: '#1a1e30', lobby: '#2c3552', lobbyFloor: '#1f2740', slab: ['#55608a', '#2a3150'], winPane: ['#18235a', '#34448a'], winFar: '#0f1738', glow: .8, sun: '#f4f0d0',
    themes: { research: mk('#2e3554', '#242a47', '#3a4064', '#2f3555', '#4fd1c5', '#4fd1c5'), marketing: mk('#38304e', '#2c2540', '#473a63', '#392f52', '#ff8fb1', '#ff8fb1'),
      sales: mk('#383550', '#2c2a42', '#4a4562', '#3b3752', '#ffc15a', '#ffc15a'), risk: mk('#2c3148', '#222639', '#3c4260', '#30354f', '#ff6b6b', '#ff6b6b'), control: mk('#322d55', '#27224a', '#453b7a', '#372f66', '#a78bfa', '#a78bfa') } },
};
let PAL_KEY = 'claude'; try { PAL_KEY = localStorage.getItem('pal') || 'claude'; } catch {}
const PAL = PALS[PAL_KEY] || PALS.claude; document.documentElement.dataset.pal = PALS[PAL_KEY] ? PAL_KEY : 'claude';

const S = { e: {}, emps: [], queue: [], results: [], journal: [], cases: {}, shipped: 0, err: 0, live: false, ai: false, roster: null };
const KEY = new URLSearchParams(location.search).get('key') || '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NAME = id => (S.e[id] ? S.e[id].def.name : id);
const stage = $('stage');

function log(text, icon = '•') {
  const li = document.createElement('li'), t = new Date().toLocaleTimeString('uz', { hour12: false });
  li.innerHTML = `<time>${t}</time><span>${icon} ${esc(text)}</span>`;
  $('log').prepend(li); while ($('log').children.length > 250) $('log').lastChild.remove();
}

/* ======================= SAHNA ======================= */
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function seeded(a) { return () => { a = (a * 16807) % 2147483647; return (a - 1) / 2147483646; }; }
const GT = TY + 5 * FW;                       // yer sathi (binoning pasti)

/* ---------- xodim: Claude uslubidagi jonli shakllar (SVG) ---------- */
let CID = 0;
const poly = (cx, cy, ro, ri, n, rot = -90) => { const p = []; for (let i = 0; i < n * 2; i++) { const r = i % 2 ? ri : ro, a = (rot + i * 180 / n) * Math.PI / 180; p.push((cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1)); } return 'M' + p.join('L') + 'Z'; };
const reg = (cx, cy, r, n, rot = -90) => { const p = []; for (let i = 0; i < n; i++) { const a = (rot + i * 360 / n) * Math.PI / 180; p.push((cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1)); } return 'M' + p.join('L') + 'Z'; };
const SH = {   // fy = ko'z chizig'i, ty = tepa, by = pastki chekka
  spark:    { fy: 33, ty: 15, by: 52, d: () => `<path d="${poly(20, 34, 18.5, 9.2, 12)}" stroke-width="4.5" stroke-linejoin="round"/>` },   // Claude uchquni
  star:     { fy: 36, ty: 15, by: 51, d: () => `<path d="${poly(20, 35, 19, 9.8, 5)}" stroke-width="4.5" stroke-linejoin="round"/>` },
  hex:      { fy: 33, ty: 18, by: 50, d: () => `<path d="${reg(20, 34, 15.5, 6)}" stroke-width="4" stroke-linejoin="round"/>` },
  gem:      { fy: 32, ty: 15, by: 51, d: () => `<path d="M20 15 L33 24 L28 51 L12 51 L7 24Z" stroke-width="3" stroke-linejoin="round"/>`, extra: '<path d="M7 24 H33 M14 24 L20 51 M26 24 L20 51 M14 24 L20 15 L26 24" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1"/>' },
  flower:   { fy: 33, ty: 15, by: 49, d: () => [0, 1, 2, 3, 4, 5].map(i => { const a = (-90 + i * 60) * Math.PI / 180; return `<circle cx="${(20 + 11 * Math.cos(a)).toFixed(1)}" cy="${(34 + 11 * Math.sin(a)).toFixed(1)}" r="7.4"/>`; }).join('') + '<circle cx="20" cy="34" r="11.5"/>' },
  bubble:   { fy: 29, ty: 16, by: 45, d: () => '<rect x="5" y="16" width="30" height="29" rx="11"/><path d="M10 42 L7 53 L20 44Z" stroke-width="2" stroke-linejoin="round"/>' },
  triangle: { fy: 39, ty: 12, by: 50, d: () => '<path d="M20 15 L36.5 47 L3.5 47Z" stroke-width="6" stroke-linejoin="round"/>' },
  cloud:    { fy: 36, ty: 21, by: 48, d: () => '<circle cx="13" cy="38" r="9"/><circle cx="22" cy="31" r="11.5"/><circle cx="30" cy="39" r="8.5"/><rect x="12" y="38" width="19" height="10" rx="5"/>' },
  cube:     { fy: 31, ty: 17, by: 50, d: () => '<rect x="5" y="17" width="30" height="33" rx="8"/>' },
  shield:   { fy: 31, ty: 15, by: 53, d: () => '<path d="M20 15 L34 20 L34 36 Q34 47 20 53 Q6 47 6 36 L6 20Z" stroke-width="3" stroke-linejoin="round"/>' },
  pill:     { fy: 29, ty: 14, by: 54, d: () => '<rect x="9" y="14" width="22" height="40" rx="11"/>' },
  blob:     { fy: 33, ty: 14, by: 52, d: () => '<path d="M8 36 Q4 20 18 16 Q34 12 35 30 Q38 48 22 52 Q8 54 8 36Z" stroke-width="3" stroke-linejoin="round"/>' },
};
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), c = v => Math.max(0, Math.min(255, v));
  return '#' + [(n >> 16) + amt, ((n >> 8) & 255) + amt, (n & 255) + amt].map(v => c(v).toString(16).padStart(2, '0')).join('');
}
function svgChar(l, opt = {}) {
  const s = SH[l.shape] || SH.blob, c = l.color, dk = shade(c, -42), id = 'cp' + (CID++), ey = s.fy, ty = s.ty, by = s.by;
  const bw = Math.min(ey + 12, by - 5), sy = ey + 9;
  const acc = {
    glasses: `<g fill="#ffffff22" stroke="#1e2430" stroke-width="1.3"><circle cx="15.2" cy="${ey}" r="4.7"/><circle cx="24.8" cy="${ey}" r="4.7"/><path d="M19.9 ${ey}h.2"/></g>`,
    headphones: `<path d="M6.5 ${ty + 12} Q6.5 ${ty - 5} 20 ${ty - 5} Q33.5 ${ty - 5} 33.5 ${ty + 12}" fill="none" stroke="#232a3a" stroke-width="2.6"/><rect x="3.8" y="${ty + 8}" width="5" height="9" rx="2.4" fill="#232a3a"/><rect x="31.2" y="${ty + 8}" width="5" height="9" rx="2.4" fill="#232a3a"/>`,
    bow: `<path d="M20 ${bw} L12.5 ${bw - 4.2} L12.5 ${bw + 4.2}Z M20 ${bw} L27.5 ${bw - 4.2} L27.5 ${bw + 4.2}Z" fill="#c0392b"/><circle cx="20" cy="${bw}" r="2.2" fill="#8e2a20"/>`,
    cap: `<path d="M8.5 ${ty + 6} Q8.5 ${ty - 7} 20 ${ty - 7} Q31.5 ${ty - 7} 31.5 ${ty + 6}Z" fill="#22283a"/><path d="M25 ${ty + 3} L37 ${ty + 6} L37 ${ty + 8.5} L25.5 ${ty + 7.5}Z" fill="#22283a"/>`,
    scarf: `<path d="M8 ${sy} Q20 ${sy + 7} 32 ${sy} L32 ${sy + 5} Q20 ${sy + 12} 8 ${sy + 5}Z" fill="#e84393"/><rect x="25" y="${sy + 4}" width="4.5" height="9" rx="2" fill="#e84393"/>`,
    crown: `<path d="M12 ${ty + 3} L13.5 ${ty - 6} L17 ${ty - 1} L20 ${ty - 8} L23 ${ty - 1} L26.5 ${ty - 6} L28 ${ty + 3}Z" fill="#f4c542" stroke="#c99a1e" stroke-width="1" stroke-linejoin="round"/>`,
    brows: `<path d="M10.8 ${ey - 6.2} L18.2 ${ey - 4.4} M29.2 ${ey - 6.2} L21.8 ${ey - 4.4}" stroke="#1c1f2a" stroke-width="1.7" stroke-linecap="round"/>`,
    none: '',

  const body = s.d();

    ${opt.noShadow ? '' : '<ellipse cx="20" cy="70.5" rx="12" ry="2.6" fill="#0003"/>'}
    <g class="lgL"><rect x="13.4" y="${by - 4}" width="5.8" height="${69 - by + 4}" rx="2.9" fill="${dk}"/><ellipse cx="16.3" cy="68.8" rx="5.3" ry="2.7" fill="#1b1e29"/></g>
    <g class="lgR"><rect x="20.8" y="${by - 4}" width="5.8" height="${69 - by + 4}" rx="2.9" fill="${dk}"/><ellipse cx="23.7" cy="68.8" rx="5.3" ry="2.7" fill="#1b1e29"/></g>
    <g class="arL"><rect x="1.2" y="${ey + 2}" width="5.6" height="12.5" rx="2.8" fill="${dk}"/></g>
    <g class="arR"><rect x="33.2" y="${ey + 2}" width="5.6" height="12.5" rx="2.8" fill="${dk}"/></g>
    <g fill="${c}" stroke="${c}">${body}</g>
    <clipPath id="${id}"><g>${body}</g></clipPath>
    <g clip-path="url(#${id})"><ellipse cx="13" cy="${ty + 9}" rx="12" ry="8.5" fill="#fff" opacity=".2"/><rect x="0" y="${by - 13}" width="40" height="22" fill="#000" opacity=".11"/></g>
    ${s.extra || ''}
    <ellipse cx="11.4" cy="${ey + 5.4}" rx="2.2" ry="1.5" fill="#ff7a7a" opacity=".32"/><ellipse cx="28.6" cy="${ey + 5.4}" rx="2.2" ry="1.5" fill="#ff7a7a" opacity=".32"/>
    <ellipse cx="15.2" cy="${ey}" rx="3.2" ry="3.8" fill="#fff"/><ellipse cx="24.8" cy="${ey}" rx="3.2" ry="3.8" fill="#fff"/>
    <circle cx="15.8" cy="${ey + .5}" r="1.9" fill="#1c1f2a"/><circle cx="25.4" cy="${ey + .5}" r="1.9" fill="#1c1f2a"/>
    <circle cx="16.5" cy="${ey - .5}" r=".75" fill="#fff"/><circle cx="26.1" cy="${ey - .5}" r=".75" fill="#fff"/>
    <path d="M17.2 ${ey + 7} Q20 ${ey + 9.6} 22.8 ${ey + 7}" stroke="#1c1f2a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    ${acc}
  </svg>`;
}
const miniChar = (l, x, y, s) => `<svg x="${x}" y="${y}" width="${40 * s}" height="${72 * s}" viewBox="0 0 40 72">${svgChar(l, { noShadow: true }).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</svg>`;

      <path d="M${x + 75} 18 V80" stroke="#fff" stroke-width="2"/><path d="M${x + 10} 80 L${x + 60} 18 L${x + 80} 18 L${x + 30} 80Z" fill="#fff" opacity=".16"/></g>`;
  });

function say(e, text, ms = 2600) {
  const b = e.el.querySelector('.bubble'); b.textContent = text; e.el.classList.add('say');
  clearTimeout(e._bt); e._bt = setTimeout(() => e.el.classList.remove('say'), ms);
}
function setState(e, state, taskText) {
  e.state = state;
  ['working', 'waiting', 'done', 'error', 'typing'].forEach(c => e.el.classList.remove(c));
  if (state !== 'idle' && state !== 'walking') e.el.classList.add(state);
  e.desk.classList.toggle('work', state === 'working');
  if (state === 'working' && e.sitting) e.el.classList.add('typing');
  if (taskText !== undefined) e.el.querySelector('.tk').textContent = taskText || e.def.title;
  render();
}
function setProgress(e, v) { e.progress = v; e.el.querySelector('.pb div').style.width = (v * 100) + '%'; }
function enqueue(e, fn) { e.pending++; e.q = e.q.then(fn).catch(err => console.error(err)).finally(() => { e.pending--; }); return e.q; }
const alive = e => e.mode === 'idle';

function go(e, x, y, z) {
  return new Promise(res => {
    const dx = x - e.x, dy = y - e.y, d = Math.hypot(dx, dy);
    if (d < 1) return res();
    const dur = d / (100 * e.def.traits.speed);
    e.el.style.transition = `left ${dur}s linear, top ${dur}s linear`;
    e.el.classList.add('walking'); e.el.classList.remove('typing');
    if (Math.abs(dx) > 2) e.el.classList.toggle('left', dx < 0);
    e.x = x; e.y = y; e.el.style.zIndex = z || Math.round(y);
    e.el.style.left = x + 'px'; e.el.style.top = y + 'px';
    setTimeout(() => { e.el.classList.remove('walking'); res(); }, dur * 1000 + 40);
  });
}

/* lift: bitta kabina, navbat bilan */
const ELEV = { f: 1, lock: Promise.resolve() };
const cabinTop = n => Y(n) + 18;
function moveCabin(n, dur) {
  const c = $('cabin'); c.style.transition = `top ${dur}s ease-in-out`; c.style.top = cabinTop(n) + 'px'; ELEV.f = n; return sleep(dur * 1000 + 60);
}
function ride(e, to) {
  const job = ELEV.lock.then(async () => {
    if (ELEV.f !== e.f) await moveCabin(e.f, Math.abs(ELEV.f - e.f) * .7 + .25);
    await sleep(250);
    const dur = Math.abs(to - e.f) * .8 + .3;
    e.el.style.zIndex = 900;
    e.el.style.transition = `top ${dur}s ease-in-out`; e.y = LANE(to); e.f = to; e.el.style.top = e.y + 'px';
    await moveCabin(to, dur);
    e.el.style.zIndex = Math.round(e.y);
    await sleep(200);
  });
  ELEV.lock = job.catch(() => {});
  return job;
}

async function standUp(e) { if (e.sitting) { e.sitting = false; await go(e, e.x, LANE(e.f)); } }
async function goTo(e, n, x) {                         // istalgan qavatdagi chizig'ga borish
  await standUp(e);
  if (e.f !== n) { await go(e, DOOR_X, LANE(e.f)); await ride(e, n); }
  await go(e, x, LANE(n));
}
async function goSeat(e) {
  await goTo(e, e.home.f, e.home.x);
  await go(e, e.home.x, SEAT(e.home.f), SEAT(e.home.f)); e.sitting = true; e.el.classList.remove('left');
  if (e.state === 'working') e.el.classList.add('typing');
}
const spotX = (n, name) => TX + ({ coffee: 560, cooler: 612, board: n === 5 ? 480 : 304, sofa: 690, window: 180 }[name]);
async function goNear(e, other) {
  const side = e.home.x <= other.home.x ? -46 : 46;
  await goTo(e, other.home.f, other.home.x + side);
  e.el.classList.toggle('left', side > 0);
}

/* ======================= O'Z HAYOTI (xarakter) ======================= */
async function idleStep(e) {
  const t = e.def.traits;
  const w = [['stay', Math.max(.15, 1.1 - t.wander)], ['quote', .7], ['coffee', t.coffee], ['cooler', .25], ['chat', t.chat], ['board', t.wander * .5], ['sofa', t.wander * .3], ['window', t.wander * .3]];
  let r = Math.random() * w.reduce((a, b) => a + b[1], 0), act = 'stay';
  for (const [k, v] of w) { if ((r -= v) <= 0) { act = k; break; } }
  if (act === 'stay') return sleep(rnd(1500, 3500));
  if (act === 'quote') return say(e, pick(e.def.lines), 3200);
  if (['coffee', 'cooler', 'board', 'sofa', 'window'].includes(act)) {
    await goTo(e, e.f, spotX(e.f, act));
    if (!alive(e)) return;
    say(e, { coffee: '☕ Mmm…', cooler: '💧', board: pick(e.def.lines), sofa: '😮‍💨 Dam olaman', window: '🌆 Manzara zo\'r' }[act], 3000);
    await sleep(rnd(2500, 4500));
    if (alive(e)) await goSeat(e);
    return;
  }
  if (act === 'chat') {
    const free = S.emps.filter(o => o !== e && o.id !== 'boss' && o.mode === 'idle');
    const same = free.filter(o => o.home.f === e.home.f);
    const mate = (Math.random() < .8 && same.length) ? pick(same) : pick(free);
    if (!mate) return;
    await goNear(e, mate); if (!alive(e)) return;
    say(e, pick(['Salom, ' + mate.def.name + '!', 'Bir daqiqa vaqtingiz bormi?', 'Ko\'ryapsizmi, nima bo\'ldi?']), 2600);
    await sleep(1200); say(mate, pick(mate.def.lines), 2600);
    await sleep(rnd(2200, 3500));
    if (alive(e)) await goSeat(e);
  }
}
function startLife(e) {
  (async function loop() {
    for (;;) {
      await sleep(rnd(3500, 9000) / (0.6 + e.def.traits.wander));
      if (!alive(e) || e.pending > 0) continue;
      await enqueue(e, () => idleStep(e));
    }
  })();
}

    log(`${e.def.name}: «${task}» boshlandi`, '▶️');
    enqueue(e, () => goSeat(e));
  },
  progress(id, v) { const e = S.e[id]; if (e) setProgress(e, v); },
  needApproval(id, task, ev) {
    const e = S.e[id]; if (!e) return;
    if (task && ev) e.task = task;
    const item = { id: (ev && ev.itemId) || String(Math.random()), agent: id, task: e.task || 'vazifa', resultId: ev && ev.resultId };
    S.queue.push(item); e.item = item; e.mode = 'busy';
    setState(e, 'walking');
    const slot = S.queue.length - 1;
    enqueue(e, async () => { await goTo(e, 5, QX(slot)); if (e.item === item) { setState(e, 'waiting'); say(e, '🙋 Tasdiq kerak!', 4500); } });
    log(`${e.def.name}: «${item.task}» tasdiq kutmoqda`, '🙋');
  },
  decide(itemId, ok) {
    const i = S.queue.findIndex(q => q.id === itemId); if (i < 0) return;
    const [item] = S.queue.splice(i, 1); const e = S.e[item.agent]; e.item = null;
    requeue();
    if (ok) {
      S.shipped++; setState(e, 'done', 'Tayyor ✔'); say(e, 'Rahmat!', 2000); log(`«${item.task}» tasdiqlandi`, '✅');
      enqueue(e, () => goSeat(e));
      const t = ++e.tok; setTimeout(() => { if (e.tok === t && e.state === 'done') { e.mode = 'idle'; setProgress(e, 0); setState(e, 'idle', ''); } }, 3500);
    } else {
      setProgress(e, .4); setState(e, 'working', item.task + ' (qayta)'); say(e, 'Qayta qilaman', 2200); log(`«${item.task}» rad etildi`, '↩️');
      enqueue(e, () => goSeat(e));
    }
  },
  error(id, msg) {
    const e = S.e[id]; if (!e) return; S.err++; setState(e, 'error', msg || 'Xato'); say(e, 'Xato!', 3000);
    log(`${e.def.name}: ${msg || 'xato'}`, '⚠️'); enqueue(e, () => goSeat(e));
    const t = ++e.tok; setTimeout(() => { if (e.tok === t) { e.mode = 'idle'; setState(e, 'idle', ''); } }, 3500);
  },
  done(id) {
    const e = S.e[id]; if (!e) return; S.shipped++; setState(e, 'done', 'Tayyor ✔'); log(`${e.def.name}: «${e.task}» tayyor`, '✅');
    const t = ++e.tok; setTimeout(() => { if (e.tok === t) { e.mode = 'idle'; setProgress(e, 0); setState(e, 'idle', ''); } }, 2500);
  },
  idle(id) { const e = S.e[id]; if (!e) return; e.tok++; e.mode = 'idle'; setProgress(e, 0); setState(e, 'idle', ''); },
  log(id, msg) { const e = S.e[id]; if (e) log(`${e.def.name}: ${msg}`, '🧮'); },
  talk(id, msg, ev) {
    const from = S.e[id], to = S.e[ev.to]; if (!from || !to) return;
    const snip = String(ev.message || '').replace(/\s+/g, ' ');
    if (ev.kind === 'ask' || ev.kind === 'handoff') {
      const handoff = ev.kind === 'handoff';
      from.talkN++;
      enqueue(from, async () => {
        await goNear(from, to); say(from, handoff ? '📄 ' + snip.slice(0, 40) : `→ ${to.def.name}: ${snip.slice(0, 40)}…`, 5000);
        if (handoff) { say(to, '👍 Qabul qildim', 3000); await sleep(1800); from.talkN = Math.max(0, from.talkN - 1); await goSeat(from); }
      });
      if (!handoff && to.mode === 'idle') { to.mode = 'busy'; to.sub = true; setProgress(to, .5); setState(to, 'working', 'So\'rov: ' + snip.slice(0, 26)); enqueue(to, () => goSeat(to)); }
      log(`${from.def.name} → ${to.def.name}${handoff ? ' (topshirdi)' : ''}: ${snip.slice(0, 140)}`, handoff ? '📄' : '💬');
    } else {
      say(from, `↩ ${snip.slice(0, 44)}…`, 4200);
      log(`${from.def.name} → ${to.def.name} (javob): ${snip.slice(0, 140)}`, '↩️');
      if (from.sub) releaseSub(from);
      to.talkN = Math.max(0, to.talkN - 1);
      if (to.talkN === 0 && to.state !== 'walking' && to.state !== 'waiting') enqueue(to, () => goSeat(to));
    }
  },
  result(id, task, ev) {
    const i = S.results.findIndex(r => r.id === ev.resultId), r = { id: ev.resultId, agent: ev.agent, task: ev.task, status: ev.status };
    if (i < 0) S.results.unshift(r); else S.results[i] = r; renderResults();
    if (['review', 'approved', 'rejected', 'expired', 'interrupted'].includes(ev.status)) archive(r);
  },
  case(id, task, ev) { S.cases[ev.caseId] = ev; renderPipe(ev); },
  journal(id, task, ev) { if (!S.journal.find(j => j.caseId === ev.caseId && j.time === ev.time)) S.journal.unshift(ev); renderJournal(); },
  event(ev) {
    if (ev.type === 'decide') return API.decide(ev.itemId, ev.ok);
    const f = API[ev.type]; if (f && ev.type !== 'event' && (ev.agent || ev.type === 'case' || ev.type === 'journal')) f.call(API, ev.agent, ev.task ?? ev.value ?? ev.message, ev);
  },
};

function md(src) {                                // kichik markdown -> HTML (avval hammasi escape qilinadi)
  const inl = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  const L = esc(src).split('\n'); const out = []; let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push('<pre>' + b.join('\n') + '</pre>'); continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { out.push(`<h${m[1].length + 1}>${inl(m[2])}</h${m[1].length + 1}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(L[i + 1] || '')) {
      const rows = []; while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inl(c.trim()));
      out.push('<table><tr>' + cells(rows[0]).map(c => `<th>${c}</th>`).join('') + '</tr>' + rows.slice(2).map(r => '<tr>' + cells(r).map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>'); continue;
    }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
      const ord = /^\s*\d/.test(l), items = [];
      while (i < L.length && /^\s*([-*•]|\d+[.)])\s+/.test(L[i])) items.push(inl(L[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, '')));
      out.push(`<${ord ? 'ol' : 'ul'}>` + items.map(x => `<li>${x}</li>`).join('') + `</${ord ? 'ol' : 'ul'}>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#{1,4}\s|```|\s*\||\s*([-*•]|\d+[.)])\s)/.test(L[i])) p.push(inl(L[i++]));
    if (!p.length) { out.push('<p>' + inl(L[i++]) + '</p>'); continue; }
    out.push('<p>' + p.join('<br>') + '</p>');
  }
  return out.join('\n');
}

    md(s.text || '(bo\'sh)')).join('');

(async function init() {
  try { S.roster = await (await fetch('/roster.json')).json(); }
  catch { stage.innerHTML = '<div style="padding:40px;font-size:18px">Serverni ishga tushiring: <code>node server.js</code>, so\'ng <code>http://localhost:3000</code> ni oching.</div>'; return; }
  buildCity(); buildTower();
  S.roster.employees.forEach(d => { const e = makeEmp(d, DESK_X[d.slot] ?? 110); S.e[d.id] = e; S.emps.push(e); });
  // Boss (siz) — penthouse
  const boss = makeEmp({ id: 'boss', name: 'Siz (Boss)', floor: 'control', title: 'Boss', look: { shape: 'spark', color: '#c9653f', acc: 'crown' }, traits: { speed: 1, coffee: 0, chat: 0, wander: 0 }, lines: [] }, 300, { boss: true });
  boss.el.classList.add('boss'); S.e.boss = boss; S.emps.push(boss);
  S.emps.forEach(e => { if (e.id !== 'boss') startLife(e); });
  $('cabin').style.top = cabinTop(1) + 'px';
  render(); renderResults(); log('Minora ochildi' + (ARC.length ? ` · ${ARC.length} ta saqlangan hujjat` : ''), '🏢');
  try {
    const j = await (await fetch('/ping')).json();
    if (j && j.office) {
      S.live = true; if (j.ai) { S.ai = true; setupTaskbar(); log('Haqiqiy AI rejimi: ' + j.model, '🧠'); }
      const es = new EventSource('/events?key=' + encodeURIComponent(KEY)); es.onmessage = m => API.event(JSON.parse(m.data));
      es.onopen = () => log('Serverga ulandi', '🔌');
    }
  } catch {}
})();
</script>
</body>
