<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=10;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const FONT='"Helvetica Neue",Arial,"DejaVu Sans",sans-serif';
const C={bg:'#080d1f',blue:'#4f8cff',teal:'#22d3a6',amber:'#ffb020',pink:'#ff5d8f',white:'#f4f7ff'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,s,d)=>clamp((t-s)/d);
const eOut=x=>1-Math.pow(1-x,4);
const eIn=x=>x*x*x;
const eBack=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

function background(t){
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  // drifting glow blobs (periodic over DUR => loops)
  const w=2*Math.PI/DUR;
  const blobs=[[C.blue,.25,.3,380,0],[C.teal,.75,.65,340,2],[C.pink,.4,.85,300,4],[C.amber,.8,.15,260,1]];
  for(const [col,bx,by,r,ph] of blobs){
    const x=W*bx+Math.cos(w*t+ph)*160, y=H*by+Math.sin(w*t*1+ph)*220;
    const gr=g.createRadialGradient(x,y,0,x,y,r*1.6);
    gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');
    g.fillStyle=gr;g.fillRect(0,0,W,H);
  }
  // grid
  g.strokeStyle='rgba(255,255,255,0.05)';g.lineWidth=2;
  const off=(t/DUR*120)%120;
  for(let x=-120+off;x<W+120;x+=120){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  for(let y=-120+off;y<H+120;y+=120){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
}

function text(s,x,y,size,color,{align='center',weight=900,alpha=1}={}){
  g.save();g.globalAlpha=alpha;g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';
  g.font=`${weight} ${size}px ${FONT}`;g.fillText(s,x,y);g.restore();
}
function fitSize(s,maxW,start=300){
  g.font=`900 ${start}px ${FONT}`;const w=g.measureText(s).width;return Math.min(start,start*maxW/w);
}

// Scene A: stacked word reveal
const WORDS=[['HISOB-KITOB',C.blue],['SOTUVLAR',C.teal],['HR',C.amber],['ISH HAQI',C.pink],['LOYIHALAR',C.blue]];
function sceneA(t){
  const t0=.3,step=.72,end=4.1;
  if(t<t0||t>end+.4)return;
  const out=eIn(prog(t,end,.4));
  g.save();g.translate(0,-out*H*.3);g.globalAlpha=1-out;
  text('BIZNESINGIZ UCHUN',W/2,330,54,'rgba(244,247,255,.7)',{weight:700});
  const fadeIn=eOut(prog(t,t0,.5));
  g.fillStyle=C.white;g.fillRect(W/2-fadeIn*120,380,fadeIn*240,6);
  WORDS.forEach(([w,col],i)=>{
    const s=t0+i*step, p=eOut(prog(t,s,.45));
    if(p<=0)return;
    const size=fitSize(w,W-140,160);
    const cy=640+i*230, bh=170;
    g.save();
    g.beginPath();g.rect(0,cy-bh/2,W,bh);g.clip();
    const dy=(1-p)*bh;
    text(w,W/2,cy+dy,size,col);
    g.restore();
    // underline sweep
    const u=eInOut(prog(t,s+.15,.5));
    g.fillStyle=col;g.globalAlpha=.9;g.fillRect(W/2-(W-200)/2,cy+bh/2+4,(W-200)*u,5);g.globalAlpha=1;
  });
  g.restore();
}

// Scene B: slam
function sceneB(t){
  const s=4.3,e=6.5;
  if(t<s||t>e+.3)return;
  const out=eIn(prog(t,e,.3));
  g.save();g.globalAlpha=1-out;
  const lines=[['BARCHASI',C.white,0],['BITTA',C.teal,.35],['JOYDA.',C.amber,.7]];
  lines.forEach(([w,col,d],i)=>{
    const p=eBack(prog(t,s+d,.5));
    if(p<=0)return;
    const size=fitSize(w,W-120,330);
    const cy=620+i*340;
    g.save();g.translate(W/2,cy);g.scale(p,p);g.rotate((1-p)*-.15);
    text(w,0,0,size,col);g.restore();
  });
  g.restore();
}

// Scene C: counters
function sceneC(t){
  const s=6.6,e=8.55;
  if(t<s||t>e+.3)return;
  const out=eIn(prog(t,e,.3));
  g.save();g.globalAlpha=1-out;g.translate(0,-out*200);
  const items=[[700,'+','MIJOZLAR',C.blue],[50,'+','DAVLATLARDA',C.teal]];
  items.forEach(([n,suf,label,col],i)=>{
    const d=s+i*.45, p=prog(t,d,1.0), v=Math.round(eOut(p)*n);
    const a=eOut(prog(t,d,.3));
    const cy=720+i*480;
    g.save();g.globalAlpha*=a;g.translate(0,(1-a)*80);
    text(v+suf,W/2,cy,380,col);
    text(label,W/2,cy+230,80,C.white,{weight:700});
    g.restore();
  });
  g.restore();
}

// Scene D: logo end
function sceneD(t){
  const s=8.6;
  if(t<s)return;
  const p=eBack(prog(t,s,.7));
  // rings
  for(let i=0;i<3;i++){
    const rp=eOut(prog(t,s+i*.12,.9));
    g.strokeStyle=[C.blue,C.teal,C.amber][i];g.lineWidth=6;g.globalAlpha=.8*(1-i*.2);
    g.beginPath();g.arc(W/2,740,(250+i*55)*rp,0,Math.PI*2);g.stroke();
  }
  g.globalAlpha=1;
  g.save();g.translate(W/2,740);g.scale(p,p);
  g.fillStyle=C.blue;
  const r=190;g.beginPath();g.roundRect(-r,-r,r*2,r*2,56);g.fill();
  text('KPI',0,6,190,C.white);
  g.restore();
  const a=eOut(prog(t,s+.6,.5));
  g.save();g.globalAlpha=a;g.translate(0,(1-a)*50);
  text('All-in-One',W/2,1290,92,C.white,{weight:700});
  text('Business Management',W/2,1400,92,C.white,{weight:700});
  g.restore();
  const b=eOut(prog(t,s+.95,.5));
  g.save();g.globalAlpha=b;g.translate(0,(1-b)*50);
  g.fillStyle=C.teal;g.beginPath();g.roundRect(W/2-290,1520,580,130,65);g.fill();
  text('kpi.com',W/2,1587,76,C.bg);
  g.restore();
}

window.draw=function(t){
  background(t);
  sceneA(t);sceneB(t);sceneC(t);sceneD(t);
  // quick fade-in at start
  const f=1-eOut(prog(t,0,.3));
  if(f>0){g.fillStyle=`rgba(8,13,31,${f})`;g.fillRect(0,0,W,H)}
};
draw(0);
</script></body></html>
