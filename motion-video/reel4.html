<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=33.1;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const FONT='Inter,"Helvetica Neue",Arial,"DejaVu Sans",sans-serif';
const SLATE='#2d3a4a', BLUE='#0a5ce0', WHITE='#ffffff';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,s,d)=>clamp((t-s)/d);
const eOut=x=>1-Math.pow(1-x,4), eIn=x=>x*x*x;
const eBack=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;


const IMGS={};
const files={logo:'assets/original-logo.png',humans:'assets/humans.png',term:'assets/ui/terminal.png'};
window.ready=Promise.all(Object.entries(files).map(([k,s])=>new Promise(r=>{const im=new Image();im.onload=()=>{IMGS[k]=im;r()};im.onerror=()=>r();im.src=s})));

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function text(s,x,y,size,color,{align='center',weight=800,alpha=1}={}){
  g.save();g.globalAlpha*=alpha;g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';
  g.font=`${weight} ${size}px ${FONT}`;g.fillText(s,x,y);g.restore();
}
function fit(s,maxW,size,weight=800){g.font=`${weight} ${size}px ${FONT}`;const w=g.measureText(s).width;return Math.min(size,size*maxW/w)}

// ---- vector icons drawn inside a chip, centred at 0,0, ~size 60
function icon(name,col){
  g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=7;g.lineCap='round';g.lineJoin='round';
  switch(name){
    case 'check':g.beginPath();g.moveTo(-24,2);g.lineTo(-8,18);g.lineTo(26,-18);g.stroke();break;
    case 'dollar':g.font=`900 70px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText('$',0,4);break;
    case 'bars':[[-24,6,16],[-6,-8,30],[12,-22,44]].forEach(([x,y,h])=>{g.fillRect(x,28-h,13,h)});break;
    case 'user':g.beginPath();g.arc(0,-12,13,0,7);g.fill();g.beginPath();g.arc(0,34,28,Math.PI,0);g.fill();break;
    case 'clock':g.beginPath();g.arc(0,0,27,0,7);g.stroke();g.beginPath();g.moveTo(0,-14);g.lineTo(0,0);g.lineTo(12,8);g.stroke();break;
    case 'chat':g.beginPath();g.roundRect(-28,-24,56,40,12);g.fill();g.beginPath();g.moveTo(-12,14);g.lineTo(-16,30);g.lineTo(4,15);g.fill();break;
    case 'star':g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?12:29;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();break;
    case 'flag':g.beginPath();g.moveTo(-18,-28);g.lineTo(-18,30);g.stroke();g.beginPath();g.moveTo(-18,-26);g.lineTo(26,-16);g.lineTo(-18,-2);g.fill();break;
    case 'bell':g.beginPath();g.moveTo(-24,16);g.quadraticCurveTo(-20,-4,-18,-12);g.arc(0,-12,18,Math.PI,0);g.quadraticCurveTo(20,-4,24,16);g.closePath();g.fill();g.beginPath();g.arc(0,24,7,0,7);g.fill();break;
    case 'pie':g.beginPath();g.arc(0,0,28,0,7);g.stroke();g.beginPath();g.moveTo(0,0);g.lineTo(0,-28);g.arc(0,0,28,-Math.PI/2,Math.PI*.4);g.closePath();g.fill();break;
    case 'trend':g.beginPath();g.moveTo(-28,20);g.lineTo(-8,-2);g.lineTo(8,10);g.lineTo(28,-22);g.stroke();g.beginPath();g.moveTo(14,-22);g.lineTo(28,-22);g.lineTo(28,-8);g.stroke();break;
    case 'file':g.beginPath();g.moveTo(-18,-28);g.lineTo(8,-28);g.lineTo(22,-14);g.lineTo(22,28);g.lineTo(-18,28);g.closePath();g.fill();g.fillStyle='rgba(255,255,255,.55)';g.fillRect(-8,2,20,5);g.fillRect(-8,14,20,5);break;
    case 'lock':g.beginPath();g.roundRect(-22,-4,44,34,8);g.fill();g.beginPath();g.arc(0,-6,14,Math.PI,0);g.stroke();break;
  }
  g.restore();
}
function chip(name,x,y,col,p,t,ph){
  if(p<=0)return;
  const bob=Math.sin(t*2.4+ph)*10;
  g.save();g.translate(x,y+bob);g.scale(p,p);g.rotate((1-p)*.6+Math.sin(t*1.6+ph)*.06);
  g.shadowColor='rgba(0,0,0,.28)';g.shadowBlur=36;g.shadowOffsetY=14;
  g.fillStyle=WHITE;rr(-62,-62,124,124,38);g.fill();g.shadowColor='transparent';
  icon(name,col);g.restore();
}
function sparkle(x,y,r,a,col=WHITE){
  if(a<=0)return;g.save();g.translate(x,y);g.globalAlpha=a;g.fillStyle=col;g.rotate(Math.PI/4*(1-a));
  g.beginPath();for(let i=0;i<8;i++){const ang=i*Math.PI/4,rr_=i%2?r*.22:r;g.lineTo(Math.cos(ang)*rr_,Math.sin(ang)*rr_)}g.fill();g.restore();
}
function cursor(x,y,s=1){
  g.save();g.translate(x,y);g.scale(s,s);g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=14;g.shadowOffsetY=6;
  g.fillStyle='#111';g.strokeStyle=WHITE;g.lineWidth=5;g.lineJoin='round';
  g.beginPath();g.moveTo(0,0);g.lineTo(0,62);g.lineTo(16,48);g.lineTo(28,74);g.lineTo(42,68);g.lineTo(30,43);g.lineTo(52,42);g.closePath();g.stroke();g.fill();g.restore();
}

function blobs(t,col){
  const w=2*Math.PI/DUR;
  g.save();g.globalAlpha=.10;g.fillStyle=WHITE;
  [[.15,.2,420,0],[.9,.55,360,2],[.3,.95,300,4]].forEach(([bx,by,r,ph])=>{
    g.beginPath();g.arc(W*bx+Math.cos(w*t+ph)*90,H*by+Math.sin(w*t+ph)*140,r,0,7);g.fill();
  });
  g.restore();
}


const GREEN='#16a34a',ORANGE='#e8920a',RED='#dc2626',INK='#111827',MUTED='#6b7685';
const A=4.3,B=9.7,C=17.2,D=20.4,E=28.6;
const bgWipe=(lt,prev,col)=>{g.fillStyle=prev;g.fillRect(0,0,W,H);const r=eInOut(prog(lt,0,.55))*2600;g.fillStyle=col;g.beginPath();g.arc(W/2,H*.78,r,0,7);g.fill()};
function pill(s,x,y,col,bg,size=26,p=1){g.save();g.translate(x,y);g.scale(p,p);g.font=`700 ${size}px ${FONT}`;const w=g.measureText(s).width+36,h=size+22;g.fillStyle=bg;rr(-w/2,-h/2,w,h,h/2);g.fill();text(s,0,2,size,col,{weight:700});g.restore();return w}

function intro(t){
  g.fillStyle=SLATE;g.fillRect(0,0,W,H);blobs(t,SLATE);
  const rows=[['Xodim ishda',WHITE,.2,150,720],['bo\'ldimi?','#7fb0ff',.55,190,900]];
  const out=eIn(prog(t,2.0,.25));
  g.save();g.globalAlpha=1-out;
  rows.forEach(([s,col,d,sz,cy])=>{const q=eOut(prog(t,d,.5)),size=fit(s,W-140,sz),bh=size*1.15;g.save();g.beginPath();g.rect(0,cy-bh/2,W,bh);g.clip();text(s,W/2,cy+(1-q)*bh,size,col);g.restore()});
  g.restore();
  const q=eBack(prog(t,2.1,.5));
  if(q>0){g.save();g.translate(W/2,960);g.scale(q,q);text('Endi aniq bilasiz.',0,0,fit('Endi aniq bilasiz.',W-300,110),WHITE);
    g.fillStyle=GREEN;rr(-240,80,480*eOut(prog(t,2.4,.4)),10,5);g.fill();g.restore()}
  const k=eOut(prog(t,.9,.4));sparkle(800,520,46*k,k);sparkle(280,1220,32*k,k);
}


// realistic face-recognition terminal ----------------------------------
function lens(x,y,r){
  const o=g.createRadialGradient(x,y,0,x,y,r+6);o.addColorStop(0,'#3a4250');o.addColorStop(1,'#0a0c10');
  g.fillStyle=o;g.beginPath();g.arc(x,y,r+6,0,7);g.fill();
  const l=g.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r);l.addColorStop(0,'#5b6b8c');l.addColorStop(.35,'#1b2440');l.addColorStop(1,'#020308');
  g.fillStyle=l;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.fillStyle='rgba(120,160,255,.55)';g.beginPath();g.arc(x-r*.35,y-r*.35,r*.22,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.8)';g.beginPath();g.arc(x+r*.3,y+r*.25,r*.08,0,7);g.fill();
}
function personIcon(cx,cy,s,a,tint){
  // modern avatar: gradient head + shoulders inside soft circle
  g.save();g.globalAlpha=a;
  const bg=g.createRadialGradient(cx,cy-20*s,10,cx,cy,190*s);bg.addColorStop(0,'rgba(127,176,255,.28)');bg.addColorStop(1,'rgba(127,176,255,0)');
  g.fillStyle=bg;g.beginPath();g.arc(cx,cy,190*s,0,7);g.fill();
  const sk=g.createLinearGradient(cx,cy-150*s,cx,cy+160*s);sk.addColorStop(0,tint[0]);sk.addColorStop(1,tint[1]);
  g.fillStyle=sk;
  g.beginPath();g.arc(cx,cy-52*s,66*s,0,7);g.fill();
  g.beginPath();g.moveTo(cx-140*s,cy+160*s);g.bezierCurveTo(cx-140*s,cy+40*s,cx-80*s,cy+22*s,cx,cy+22*s);
  g.bezierCurveTo(cx+80*s,cy+22*s,cx+140*s,cy+40*s,cx+140*s,cy+160*s);g.closePath();g.fill();
  g.restore();
}
function terminal(lt,t){
  bgWipe(lt,SLATE,BLUE);blobs(t,BLUE);
  const q=eOut(prog(lt,.25,.5));
  g.save();g.globalAlpha=q;g.translate(0,(1-q)*50);
  text('Yuz orqali kirish',W/2,200,104,WHITE);
  pill('Hikvision terminal',W/2,320,BLUE,WHITE,36);g.restore();
  const p=eOut(prog(lt,.2,.7)),dw=500,dh=880,dy=900;
  const ok=lt>1.75, okA=eBack(prog(lt,1.75,.45));
  g.save();g.translate(W/2,dy+(1-p)*900);g.rotate((1-p)*.05);
  // wall shadow
  g.save();g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=90;g.shadowOffsetY=50;g.fillStyle='#0b0d11';rr(-dw/2,-dh/2,dw,dh,58);g.fill();g.restore();
  // body: brushed dark metal
  const bd=g.createLinearGradient(-dw/2,-dh/2,dw/2,dh/2);bd.addColorStop(0,'#3a404a');bd.addColorStop(.45,'#1a1e25');bd.addColorStop(1,'#0c0e12');
  g.fillStyle=bd;rr(-dw/2,-dh/2,dw,dh,58);g.fill();
  g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=3;rr(-dw/2+1.5,-dh/2+1.5,dw-3,dh-3,56);g.stroke();
  g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=2;rr(-dw/2+10,-dh/2+10,dw-20,dh-20,48);g.stroke();
  // top sensor strip
  const ty=-dh/2+64;
  g.fillStyle='#07080b';rr(-170,ty-34,340,68,34);g.fill();
  lens(-92,ty,22);lens(92,ty,22);
  for(let i=-1;i<=1;i+=2){g.fillStyle='rgba(150,20,30,.85)';g.beginPath();g.arc(i*36,ty,7,0,7);g.fill()}
  g.fillStyle='#111';g.beginPath();g.arc(0,ty,6,0,7);g.fill();
  // fill-light bar
  const fl=ok?.95:(.35+.25*Math.sin(t*5));g.fillStyle=`rgba(255,255,255,${fl})`;rr(-60,ty+46,120,8,4);g.fill();
  // screen (glass)
  const sx=-dw/2+30,sy=-dh/2+128,sw=dw-60,sh=600;
  g.fillStyle='#000';rr(sx-6,sy-6,sw+12,sh+12,22);g.fill();
  g.save();rr(sx,sy,sw,sh,18);g.clip();
  const cam=g.createLinearGradient(0,sy,0,sy+sh);cam.addColorStop(0,'#1d2b44');cam.addColorStop(1,'#070b14');g.fillStyle=cam;g.fillRect(sx,sy,sw,sh);
  const vg=g.createRadialGradient(0,sy+sh*.42,60,0,sy+sh*.42,sh*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=vg;g.fillRect(sx,sy,sw,sh);
  // status bar
  text('08:57',sx+24,sy+30,22,WHITE,{align:'left',weight:700});
  text('29.09  Seshanba',sx+sw-24,sy+30,18,'rgba(255,255,255,.7)',{align:'right',weight:500});
  // person icon
  const pa=eOut(prog(lt,.6,.4)),fy=sy+250;
  personIcon(0,fy,1,pa,ok?['#bbf7d0','#4ade80']:['#e2e8f0','#94a3b8']);
  // scan frame
  const fs=150,fc=ok?'#22c55e':'#60a5fa';
  g.strokeStyle=fc;g.lineWidth=6;g.lineCap='round';
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{g.beginPath();g.moveTo(a*fs,fy-30+b*(fs-44));g.lineTo(a*fs,fy-30+b*fs);g.lineTo(a*(fs-44),fy-30+b*fs);g.stroke()});
  // face landmarks + scan line while scanning
  if(!ok&&lt>.9){
    const pts=[[-26,-70],[26,-70],[0,-48],[-18,-30],[18,-30],[-44,-60],[44,-60],[0,-95],[-38,-35],[38,-35]];
    const k=prog(lt,.9,.6);
    g.fillStyle='#93c5fd';pts.forEach(([x,y],i)=>{if(i/pts.length<k){g.beginPath();g.arc(x,fy+y,4,0,7);g.fill()}});
    g.strokeStyle='rgba(147,197,253,.45)';g.lineWidth=1.5;g.beginPath();pts.forEach(([x,y],i)=>{if(i/pts.length<k)(i?g.lineTo(x,fy+y):g.moveTo(x,fy+y))});g.stroke();
    const sp=((lt-.9)*1.4)%1,yy=fy-30-fs+sp*fs*2;const lg=g.createLinearGradient(0,yy-26,0,yy+26);
    lg.addColorStop(0,'rgba(96,165,250,0)');lg.addColorStop(.5,'rgba(96,165,250,.85)');lg.addColorStop(1,'rgba(96,165,250,0)');g.fillStyle=lg;g.fillRect(-fs,yy-26,fs*2,52);
    text('Yuzingizni ramkaga qarating',0,sy+sh-60,22,'rgba(255,255,255,.8)',{weight:500});
  }
  if(ok){
    g.fillStyle=`rgba(34,197,94,${.14*clamp(okA)})`;g.fillRect(sx,sy,sw,sh);
    g.save();g.translate(0,(1-clamp(okA))*80);g.globalAlpha=clamp(okA);
    g.fillStyle='rgba(255,255,255,.96)';rr(sx+16,sy+sh-176,sw-32,160,24);g.fill();
    g.fillStyle='#16a34a';g.beginPath();g.arc(sx+76,sy+sh-96,36,0,7);g.fill();
    g.save();g.translate(sx+76,sy+sh-96);g.scale(.75,.75);icon('check',WHITE);g.restore();
    text('Aziz Karimov',sx+128,sy+sh-128,32,INK,{align:'left',weight:800});
    text('Kirish · 08:57',sx+128,sy+sh-90,26,'#16a34a',{align:'left',weight:700});
    text('Muvaffaqiyatli',sx+128,sy+sh-56,20,MUTED,{align:'left',weight:500});
    g.restore();
  }
  g.restore();
  // glass reflection over screen
  g.save();rr(sx,sy,sw,sh,18);g.clip();
  const rf=g.createLinearGradient(sx,sy,sx+sw,sy+sh*.6);rf.addColorStop(0,'rgba(255,255,255,.10)');rf.addColorStop(.35,'rgba(255,255,255,.03)');rf.addColorStop(.36,'rgba(255,255,255,0)');
  g.fillStyle=rf;g.fillRect(sx,sy,sw,sh);g.restore();
  // NFC card zone
  const ny=sy+sh+70;
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=4;g.lineCap='round';
  for(let i=1;i<=3;i++){g.beginPath();g.arc(-20,ny,i*14,-Math.PI/4,Math.PI/4);g.stroke()}
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(-20,ny,5,0,7);g.fill();
  // status LED strip
  const lc=ok?'#22c55e':'#3b82f6';g.save();g.shadowColor=lc;g.shadowBlur=ok?30:14;g.fillStyle=lc;rr(-90,dh/2-46,180,10,5);g.fill();g.restore();
  g.restore();
  // data path to KPI card
  const cy=1560,x0=W/2,y0=dy+dh/2+40;
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=6;g.setLineDash([4,22]);g.lineCap='round';g.lineDashOffset=-t*60;
  if(lt>1.9){g.beginPath();g.moveTo(x0,y0);g.lineTo(x0,cy-90);g.stroke()}g.setLineDash([]);
  const kc=eBack(prog(lt,2.3,.5));
  if(kc>0){g.save();g.translate(W/2,cy+30);g.scale(kc,kc);
    g.shadowColor='rgba(0,0,0,.3)';g.shadowBlur=50;g.shadowOffsetY=20;g.fillStyle=WHITE;rr(-330,-80,660,160,48);g.fill();g.shadowColor='transparent';
    const im=IMGS.humans;if(im)g.drawImage(im,-300,-62,100*200/247*1.2,124);
    text('KPI HR',-160,-18,48,INK,{align:'left',weight:800});text('Real vaqtda yangilanadi',-160,34,30,MUTED,{align:'left',weight:500});
    g.fillStyle=GREEN;const pu=1+Math.sin(t*6)*.25;g.beginPath();g.arc(285,0,11*pu,0,7);g.fill();g.restore()}
  chip('user',W/2-440,760,BLUE,eBack(prog(lt,.9,.45)),t,1);
  chip('clock',W/2+450,1010,BLUE,eBack(prog(lt,1.1,.45)),t,3);
}

const VIEWS={A:[0,0,1390],B:[880,128,520],C:[880,30,1120],D:[1330,128,670]};
const lerp=(a,b,k)=>a+(b-a)*k;
function camAt(lt){
  const seq=[[0,'A'],[1.1,'B'],[3.3,'C'],[5.3,'D']];
  let cur=VIEWS.A;
  for(let i=1;i<seq.length;i++){const [ts,key]=seq[i];const k=eInOut(prog(lt,ts,.7));const prev=VIEWS[seq[i-1][1]];if(lt>=ts){cur=prev.map((v,n)=>lerp(v,VIEWS[key][n],k))}}
  return cur;
}
function real(lt,t){
  bgWipe(lt,BLUE,'#1a2330');blobs(t,SLATE);
  const q=eOut(prog(lt,.25,.5));
  g.save();g.globalAlpha=q;g.translate(0,(1-q)*50);
  text('Terminal Attendance',W/2,200,fit('Terminal Attendance',W-120,100),WHITE);
  text('KPI HR  →  Humans  →  Attendance',W/2,300,40,'#7fb0ff',{weight:600});g.restore();
  const cp=eOut(prog(lt,.3,.65)),cw=980,ch=760,bar=56,cy=1000;
  g.save();g.translate(W/2,cy+(1-cp)*(H-cy+400));
  g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=70;g.shadowOffsetY=30;g.fillStyle=WHITE;rr(-cw/2,-ch/2-bar,cw,ch+bar,34);g.fill();g.shadowColor='transparent';
  // window bar
  g.fillStyle='#eef1f6';g.save();rr(-cw/2,-ch/2-bar,cw,ch+bar,34);g.clip();g.fillRect(-cw/2,-ch/2-bar,cw,bar);
  ['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(-cw/2+36+i*32,-ch/2-bar/2,9,0,7);g.fill()});
  text('KPI · Terminal Attendance',0,-ch/2-bar/2+1,24,MUTED,{weight:600});
  g.restore();
  // content
  const [sx,sy,sw]=camAt(lt),sh=sw*ch/cw,k=cw/sw;
  const X=x=>-cw/2+(x-sx)*k, Y=y=>-ch/2+(y-sy)*k;
  g.save();g.beginPath();g.rect(-cw/2,-ch/2,cw,ch);g.clip();
  const im=IMGS.term;if(im)g.drawImage(im,sx,sy,sw,sh,-cw/2,-ch/2,cw,ch);
  // highlights
  const hl=(x,y,w,h,col,a)=>{if(a<=0)return;const pu=1+Math.sin(t*7)*.02;g.save();g.globalAlpha=a;g.fillStyle=col+'26';g.strokeStyle=col;g.lineWidth=6;rr(X(x),Y(y),w*k,h*k,14);g.fill();g.stroke();g.restore()};
  hl(1153,128,67,470,'#22c55e',eOut(prog(lt,1.9,.3))*(lt<3.5?1:1-prog(lt,3.5,.3)));
  hl(1220,128,67,470,'#3b82f6',eOut(prog(lt,2.2,.3))*(lt<3.5?1:1-prog(lt,3.5,.3)));
  hl(1287,128,67,470,'#f59e0b',eOut(prog(lt,2.5,.3))*(lt<3.5?1:1-prog(lt,3.5,.3)));
  const tabsA=eOut(prog(lt,4.0,.3))*(lt<5.4?1:1-prog(lt,5.4,.3));
  hl(905,66,750,56,'#22c55e',tabsA);hl(1690,66,170,56,'#3b82f6',eOut(prog(lt,4.3,.3))*(lt<5.4?1:1-prog(lt,5.4,.3)));
  hl(1655,128,100,430,'#22c55e',eOut(prog(lt,6.0,.3)));
  g.restore();
  // pills over card
  const pl=(s,x,y,col,a)=>{if(a<=0)return;pill(s,x,y,WHITE,col,28,eBack(a))};
  const fade=lt<3.5?1:0;

  caps.forEach(([a,b,h,sub])=>{const o=eOut(prog(lt,a,.4))*(1-eIn(prog(lt,b-.3,.3)));if(o<=0)return;

function kinetic(lt,t){
  g.fillStyle='#1a2330';g.fillRect(0,0,W,H);blobs(t,SLATE);

}


const DBG='#eef2f8';
function card(x,y,w,h,a,dy=0){g.save();g.globalAlpha*=a;g.translate(0,dy);g.shadowColor='rgba(15,23,42,.10)';g.shadowBlur=40;g.shadowOffsetY=14;g.fillStyle=WHITE;rr(x,y,w,h,32);g.fill();g.restore()}

  text('Davomat · Bugun, 29 sentabr',60,222,36,MUTED,{align:'left',weight:500});

    g.fillStyle=col+'22';g.beginPath();g.arc(x+70,y+hh/2,44,0,7);g.fill();g.save();g.translate(x+70,y+hh/2);g.scale(.8,.8);icon(ic,col);g.restore();
    const v=n===null?suf:String(Math.round(eOut(prog(lt,.5+i*.12,.9))*n));
    text(v,x+136,y+82,76,INK,{align:'left',weight:900});
    if(n!==null&&suf){g.font=`900 76px ${FONT}`;const vw=g.measureText(v).width;text(suf,x+136+vw+6,y+92,40,MUTED,{align:'left',weight:700})}
    text(lab,x+138,y+148,32,col,{align:'left',weight:700});
    g.restore();
  });
  // weekly chart
  const ca=eOut(prog(lt,.9,.5));
  if(ca>0){const x=60,y=740,w=960,hh=400;card(x,y,w,hh,ca,(1-ca)*60);

    g.strokeStyle='#eef1f6';g.lineWidth=2;for(let k=0;k<=2;k++){const yy=base-(base-top)*k/2;g.beginPath();g.moveTo(x+40,yy);g.lineTo(x+w-40,yy);g.stroke()}
    vals.forEach((v,i)=>{const gp=eOut(prog(lt,1.1+i*.08,.6));const bh=(base-top)*v/mx*gp,bx=x+40+i*(bw+gap);
      const isMax=v===mx;g.fillStyle=isMax?ORANGE:'#bcd3ff';rr(bx,base-bh,bw,Math.max(bh,1),14);g.fill();
      if(gp>.9)text(String(v),bx+bw/2,base-bh-22,28,isMax?ORANGE:MUTED,{weight:800});
      text(days[i],bx+bw/2,base+32,26,MUTED,{weight:600});});
    g.restore();}
  // top late list
  const la=eOut(prog(lt,1.5,.5));
  if(la>0){const x=60,y=1170,w=960,hh=560;card(x,y,w,hh,la,(1-la)*60);
    g.save();g.globalAlpha=la;g.translate(0,(1-la)*60);
    text('Eng ko\'p kech qolganlar',x+40,y+58,40,INK,{align:'left',weight:800});
    pill('Oy bo\'yicha',x+w-120,y+58,ORANGE,'#fff1dc',24);
    const top=[['Jasur Aliyev','Sotuv','#0ea5e9',12,214],['Sardor Nazarov','Omborchi','#10b981',9,150],['Bekzod Tursunov','Haydovchi','#8b5cf6',7,98],['Kamola Ismoilova','Operator','#ec4899',5,61]];
    top.forEach(([n,role,col,cnt,mins],i)=>{
      const rp=eOut(prog(lt,1.75+i*.15,.45));if(rp<=0)return;
      const ry=y+120+i*108;g.save();g.globalAlpha*=rp;g.translate((1-rp)*80,0);
      if(i===0){const gl=.10+.06*Math.sin(t*5);g.fillStyle=`rgba(232,146,10,${gl})`;rr(x+20,ry-6,w-40,100,24);g.fill()}
      text('#'+(i+1),x+64,ry+44,30,i===0?ORANGE:MUTED,{weight:900});
      g.fillStyle=col;g.beginPath();g.arc(x+150,ry+44,34,0,7);g.fill();text(n.split(' ').map(s=>s[0]).join(''),x+150,ry+46,24,WHITE,{weight:800});
      text(n,x+200,ry+28,30,INK,{align:'left',weight:700});text(role,x+200,ry+64,22,MUTED,{align:'left',weight:500});
      text(cnt+' marta',x+w-60,ry+28,30,i===0?ORANGE:INK,{align:'right',weight:800});
      const hm=Math.floor(mins/60)+' soat '+(mins%60)+' daq';text(hm,x+w-60,ry+64,22,MUTED,{align:'right',weight:500});
      const bp=eOut(prog(lt,1.9+i*.15,.6));g.fillStyle='#f1f4f9';rr(x+480,ry+38,170,12,6);g.fill();g.fillStyle=i===0?ORANGE:'#fbbf77';rr(x+480,ry+38,170*mins/214*bp,12,6);g.fill();
      g.restore();});
    g.restore();}
  // download button + click
  const ba=eBack(prog(lt,5.0,.45));
  if(ba>0){g.save();g.translate(W/2,1820);g.scale(ba,ba);const press=lt>5.85&&lt<6.0?.94:1;g.scale(press,press);
    const done=lt>6.05;
    g.shadowColor=done?'rgba(22,163,74,.35)':'rgba(10,92,224,.35)';g.shadowBlur=36;g.shadowOffsetY=14;g.fillStyle=done?GREEN:BLUE;rr(-330,-62,660,124,62);g.fill();g.shadowColor='transparent';
    if(done){const k=eBack(prog(lt,6.05,.4));g.save();g.translate(-250,0);g.scale(.7*k,.7*k);icon('check',WHITE);g.restore();text('Hisobot tayyor · PDF / Excel',30,2,34,WHITE,{weight:800})}
    else{g.strokeStyle=WHITE;g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(-230,-20);g.lineTo(-230,14);g.moveTo(-246,0);g.lineTo(-230,16);g.lineTo(-214,0);g.moveTo(-250,26);g.lineTo(-210,26);g.stroke();
    text('Hisobotni yuklab olish',30,2,36,WHITE,{weight:800})}
    g.restore();
    const rp=prog(lt,5.9,.5);if(rp>0&&rp<1){g.strokeStyle=BLUE;g.lineWidth=8*(1-rp);g.globalAlpha=1-rp;g.beginPath();g.arc(W/2+60,1830,20+rp*120,0,7);g.stroke();g.globalAlpha=1}
    const cu=eInOut(prog(lt,5.3,.55));if(cu>0&&lt<6.9)cursor(W/2+60+(1-cu)*300,1830+(1-cu)*120,lt>5.85&&lt<6.0?.85:1);
  }
}

function ending(lt,t){
  bgWipe(lt,DBG,BLUE);blobs(t,BLUE);
  for(let i=0;i<3;i++){const rp=eOut(prog(lt,.15+i*.12,.8));g.strokeStyle='rgba(255,255,255,'+(.5-i*.14)+')';g.lineWidth=5;g.beginPath();g.arc(W/2,640,(210+i*70)*rp,0,7);g.stroke()}

  const im=IMGS.logo;if(im)g.drawImage(im,-170,-170,340,340);g.restore();
  const a=eOut(prog(lt,.5,.5));g.save();g.globalAlpha=a;g.translate(0,(1-a)*50);
  text('Davomat nazorati',W/2,1050,fit('Davomat nazorati',W-120,116),WHITE);
  text('Hikvision  +  KPI HR',W/2,1170,70,'#cfe0ff',{weight:600});g.restore();
  const b=eBack(prog(lt,1.0,.5));
  if(b>0){g.save();g.translate(W/2,1440);g.scale(b,b);g.fillStyle=WHITE;rr(-310,-76,620,152,76);g.fill();text('kpi.com',0,4,84,BLUE);g.restore()}
}

window.draw=function(t){
  if(t<A)intro(t);else if(t<B)terminal(t-A,t);else if(t<C)real(t-B,t);else if(t<D)kinetic(t-C,t);else if(t<E)dashboard(t-D,t);else ending(t-E,t);
  const f=1-eOut(prog(t,0,.25));if(f>0){g.fillStyle=`rgba(45,58,74,${f})`;g.fillRect(0,0,W,H)}
};
