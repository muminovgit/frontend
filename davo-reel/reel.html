<body><div id="stage">
  <div id="bg" class="a" style="width:1080px;height:1920px;z-index:0"></div>
  <div id="wipe" class="a" style="z-index:1;border-radius:50%"></div>
  <div id="L" class="a" style="z-index:2;width:1080px;height:1920px"></div>
</div>
<script>
// ===================================================================== Davo Delivery — 15s showreel
// Every style is computed from t inside seek(t). Constants and DOM are declared before the first seek.
const W=1080,H=1920,DUR=23.55;
const INK='#121212',TEAL='#09bbd4',BG='#f4f4f4',WHITE='#ffffff',Y='#ffce68',PK='#fb4669',V='#5e3a9a',G='#01bdac',MAG='#e8308a';
const T={ // scene starts
  s1:0, s2:1.85, s3:4.8, s4:6.65, s5:8.95, s6:13.55, s7:16.25, s8:18.8};   // paced to the voiceover
const E={};
const $=id=>document.getElementById(id);
// ---------------------------------------------------------------- math
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,s,d)=>clamp((t-s)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const ease={
  expoOut:x=>x>=1?1:1-Math.pow(2,-10*x), expoIn:x=>x<=0?0:Math.pow(2,10*x-10),
  expoInOut:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  cubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, quintOut:x=>1-Math.pow(1-x,5), quadIn:x=>x*x};
function spring(t,f=2.4,z=.5){if(t<=0)return 0;const w=2*Math.PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))}
function squash(tau,amp){if(tau<0)return[1,1];const s=amp*Math.exp(-tau*13)*Math.cos(tau*42);const sy=1-s;return[1/Math.sqrt(Math.max(.3,sy)),sy]}
function S(el,o){for(const k in o){const v=o[k];el.style[k]=typeof v==='number'&&k!=='opacity'&&k!=='zIndex'?v+'px':v}}
function show(el,on){el.style.display=on?'':'none'}
const meas=document.createElement('canvas').getContext('2d');
function tw(text,size,weight=900,fam='Montserrat',ls=-0.035){meas.font=`${weight} ${size}px ${fam}`;meas.letterSpacing=(ls*size)+'px';return meas.measureText(text).width}

// ---------------------------------------------------------------- builders
function div(cls,html,parent,z){const d=document.createElement('div');d.className='a '+(cls||'');if(html!==undefined)d.innerHTML=html;(parent||$('L')).appendChild(d);if(z!==undefined)d.style.zIndex=z;return d}
function img(src,parent,z){const i=document.createElement('img');i.src=src;i.className='a';(parent||$('L')).appendChild(i);if(z!==undefined)i.style.zIndex=z;return i}
function svg(html,parent,z){const d=div('',`<svg width="1080" height="1920" viewBox="0 0 1080 1920">${html}</svg>`,parent,z);return d.firstChild}
// headline: two lines of words rising from masks
function headline(id,lines,size,colors,y,opts={}){
  const words=[];lines.forEach((ln,li)=>{const ws=ln.split(' ');let total=ws.reduce((a,w)=>a+tw(w,size),0)+(ws.length-1)*size*.26;let x=opts.left!==undefined?opts.left:(W-total)/2;
    ws.forEach(w=>{const m=div('mask',undefined,undefined,40);const inner=div('h',w,m);S(inner,{fontSize:size+'px',color:colors[li]});const ww=tw(w,size);
      S(m,{left:x-6,top:y+li*size*1.08-size*.12,width:ww+16,height:size*1.24});S(inner,{left:6,top:size*.12});words.push({m,inner,li,h:size*1.24});x+=ww+size*.26})});
  E[id]={words};return E[id]}
function setHeadline(id,t,t0,tOut){const hd=E[id];hd.words.forEach((w,i)=>{const k=ease.expoOut(P(t,t0+i*.06+w.li*.05,.6));const o=tOut!==undefined?ease.expoIn(P(t,tOut+i*.025,.3)):0;
  show(w.m,k>0&&o<1);w.inner.style.transform=`translateY(${((1-k)-o)*w.h}px)`})}
// the Davo mark, rebuilt as vector from the logo: four petals + white cross
function logoSVG(){return `<g class="p" data-i="0"><circle cx="0" cy="0" r="28.5" fill="${Y}"/></g><g class="p" data-i="1"><circle cx="0" cy="0" r="28.5" fill="${PK}"/></g>
  <g class="p" data-i="2"><circle cx="0" cy="0" r="28.5" fill="${V}"/></g><g class="p" data-i="3"><circle cx="0" cy="0" r="28.5" fill="${G}"/></g>
  <g class="x"><path d="M-10.5 -29 h21 v18.5 h18.5 v21 h-18.5 v18.5 h-21 v-18.5 h-18.5 v-21 h18.5z" fill="#fff"/></g>`}
const PETAL=[[-20,-20],[20,-20],[-20,20],[20,20]];
function makeLogo(id,z){const s=svg(`<g class="root">${logoSVG()}</g>`,undefined,z);const g=s.querySelector('.root');E[id]={svg:s,root:g,petals:[...g.querySelectorAll('.p')],cross:g.querySelector('.x')};return E[id]}
// pose logo: centre (cx,cy), unit scale u (px per logo unit), petal arrival k[i], cross k
function poseLogo(L,cx,cy,u,pk,ck,crossScale=1){L.root.setAttribute('transform',`translate(${cx} ${cy}) scale(${u})`);
  L.petals.forEach((p,i)=>{const k=pk[i];const d=PETAL[i];const far=[[-1,-1],[1,-1],[-1,1],[1,1]][i];const off=(1-k)*140;
    p.setAttribute('transform',`translate(${d[0]+far[0]*off} ${d[1]+far[1]*off}) scale(${Math.max(0,lerp(.2,1,clamp(k*1.4)))})`);p.style.display=k>0?'':'none'});
  const cs=Math.max(0,ck)*crossScale;L.cross.setAttribute('transform',`rotate(${(1-clamp(ck))*-90}) scale(${cs})`);L.cross.style.display=ck>0?'':'none'}

// ---------------------------------------------------------------- build
function build(){
  // S1 / S8 logos
  makeLogo('logo1',10); makeLogo('logo8',30);
  // S2 search
  headline('h2',['Dori qidirish','bir necha soniyada.'],92,[INK,TEAL],250);
  E.bar=div('card','',undefined,20);
  E.bar.innerHTML=`<svg class="a" style="left:46px;top:40px" width="52" height="52" viewBox="0 0 52 52"><circle cx="22" cy="22" r="15" fill="none" stroke="${TEAL}" stroke-width="6"/><path d="M33 33 L46 46" stroke="${TEAL}" stroke-width="6" stroke-linecap="round"/></svg><div class="a" id="q" style="left:122px;top:30px;font-size:54px;font-weight:600;white-space:pre"></div><div class="a" id="caret" style="top:38px;width:4px;height:56px;background:${TEAL}"></div>`;
  E.cards=[['tab','Paratsetamol','tabletkalari'],['syrup','Bolalar uchun','sirop']].map(([im,a,b],i)=>{const c=div('card','',undefined,22);
    c.innerHTML=`<div class="a" style="left:0;top:0;width:430px;height:300px;border-radius:40px 40px 0 0;background:#f3f3f2"></div><img class="a" src="assets/img/${im}.png" style="left:${im==='tab'?95:130}px;top:${im==='tab'?40:20}px;height:${im==='tab'?240:265}px">
      <div class="a" style="left:34px;top:326px;font-size:34px;font-weight:700;line-height:1.15">${a}<br>${b}</div><div class="a pill" style="left:290px;top:338px;width:106px;height:52px;background:${TEAL};color:#fff;font-size:42px;font-weight:700">+</div>`;return c});
  E.tag=div('pill','Retseptsiz',undefined,24);S(E.tag,{height:56,padding:'0 26px',background:'#e9fbf8',color:G,fontSize:'28px'});
  // S3 map
  E.map=svg(`<g id="streets" stroke="#fff" stroke-opacity=".35" stroke-width="16" fill="none" stroke-linecap="round">
    <path d="M-40 760 L1120 690"/><path d="M-40 1140 L1120 1210"/><path d="M-40 1520 L1120 1440"/><path d="M180 520 L260 1960"/><path d="M560 500 L520 1960"/><path d="M900 520 L960 1960"/><path d="M-60 1700 C 300 1500, 700 1000, 1140 880" stroke-width="30" stroke-opacity=".22"/></g>
    <g id="pins"></g><g id="you"><circle r="26" fill="#fff"/><circle r="14" fill="${INK}"/><circle id="ring" r="40" fill="none" stroke="#fff" stroke-width="6"/></g>`,undefined,10);
  E.pins=[[230,880,PK],[700,760,Y],[420,1290,V],[860,1230,G],[300,1600,Y],[760,1580,PK]].map(([x,y,c])=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.innerHTML=`<path d="M0 0 C-10 -24 -42 -44 -42 -76 a42 42 0 0 1 84 0 C42 -44 10 -24 0 0z" fill="#fff"/><circle cy="-76" r="20" fill="${c}"/>`;E.map.querySelector('#pins').appendChild(g);return {g,x,y}});
  E.chips=[['Eng arzon',0],['Eng yaqin',1],["22:00 gacha",3]].map(([txt,pi])=>{const c=div('pill',txt,undefined,15);S(c,{height:76,padding:'0 34px',background:'#fff',color:INK,fontSize:'34px',boxShadow:'0 14px 30px rgba(0,0,0,.15)'});return {el:c,pi}});
  headline('h3',['Narxlarni','solishtiring.'],116,[WHITE,WHITE],230);
  // S4 delivery
  headline('h4',['Eshigingizgacha','yetkazamiz.'],100,[INK,TEAL],250);
  E.route=svg(`<path id="rt" d="M230 820 C 640 760, 120 1180, 520 1200 S 900 1250, 850 1400" fill="none" stroke="#d9d9d9" stroke-width="12" stroke-dasharray="2 26" stroke-linecap="round"/><path id="rt2" d="M230 820 C 640 760, 120 1180, 520 1200 S 900 1250, 850 1400" fill="none" stroke="${TEAL}" stroke-width="12" stroke-linecap="round"/>`,undefined,10);
  E.pharm=img('assets/img/aidkit.png',undefined,12);S(E.pharm,{width:220});
  E.home=svg(`<g id="house"><path d="M-70 10 L0 -55 L70 10 V80 H-70Z" fill="${INK}"/><rect x="-18" y="30" width="36" height="50" rx="6" fill="#fff"/></g>`,undefined,12);
  E.courier=svg(`<g id="cour"><circle r="62" fill="${TEAL}"/><g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="-24" cy="18" r="13"/><circle cx="26" cy="18" r="13"/><path d="M-24 18 L-4 -8 H18 L26 18 M-4 -8 L-12 -22 H-28 M18 -8 L22 -24 H34"/></g></g>`,undefined,14);
  E.steps=['Qabul qilindi','Tayyor',"Yo'lda",'Yetkazildi'].map((s,i)=>{const d=div('','',undefined,16);d.innerHTML=`<div class="a dot" style="left:-26px;top:-26px;width:52px;height:52px;border-radius:26px;background:#e6e6e6"></div><div class="a lab" style="left:-110px;top:44px;width:220px;text-align:center;font-size:28px;font-weight:600;color:#9a9a9a">${s}</div>`;return d});
  E.track=div('','',undefined,15);S(E.track,{height:8,background:'#e6e6e6',borderRadius:'4px'});E.trackF=div('','',E.track);S(E.trackF,{height:8,background:TEAL,borderRadius:'4px'});
  // S5 pill reminder (new)
  E.sticker=div('h','YANGI',undefined,30);S(E.sticker,{fontSize:'64px',background:Y,color:INK,padding:'14px 34px',borderRadius:'22px',transformOrigin:'50% 50%'});
  headline('h5',['Dori vaqtini','eslatamiz.'],112,[WHITE,Y],360);
  E.notif=div('card','',undefined,25);S(E.notif,{width:920,height:190,borderRadius:'44px'});
  E.notif.innerHTML=`<svg class="a" style="left:34px;top:43px" width="104" height="104" viewBox="-50 -50 100 100"><rect x="-50" y="-50" width="100" height="100" rx="24" fill="#fff" stroke="#eee" stroke-width="2"/><g transform="scale(.8)">${logoSVG().replace(/class="p" data-i="(\d)"/g,(m,i)=>`transform="translate(${PETAL[i][0]} ${PETAL[i][1]})"`)}</g></svg>
    <div class="a" style="left:166px;top:36px;font-size:26px;font-weight:600;color:#8a8a8a">Davo Delivery · hozir</div><div class="a" style="left:166px;top:72px;font-size:40px;font-weight:800">Dori ichish vaqti</div><div class="a" style="left:166px;top:124px;font-size:30px;font-weight:500;color:#555">Paratsetamol · 1 tabletka</div>`;
  E.slots=['Ertalab','Tushlik','Kechqurun'].map((s,i)=>{const d=div('','',undefined,20);d.innerHTML=`<div class="a box" style="left:0;top:0;width:280px;height:280px;border-radius:44px;background:rgba(255,255,255,.14);border:4px solid rgba(255,255,255,.35)"></div><div class="a" style="left:0;top:300px;width:280px;text-align:center;font-size:34px;font-weight:700;color:#fff">${s}</div><div class="a" style="left:0;top:346px;width:280px;text-align:center;font-size:30px;font-weight:600;color:rgba(255,255,255,.6)">${['08:00','14:00','20:00'][i]}</div>`;return d});
  E.caps=[0,1,2].map(i=>{const c=svg(`<g><rect x="-70" y="-32" width="140" height="64" rx="32" fill="#fff"/><path d="M0 -32 H38 a32 32 0 0 1 0 64 H0z" fill="${[TEAL,MAG,Y][i]}"/><rect x="-52" y="-22" width="44" height="10" rx="5" fill="#fff" opacity=".0"/></g>`,undefined,22);return c});
  E.checks=[0,1,2].map(i=>{const c=svg(`<g><circle r="40" fill="${G}"/><path d="M-17 1 L-5 13 L18 -12" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>`,undefined,24);return c});
  // S6 services carousel
  headline('h6',['Kerakli hamma narsa','bitta ilovada.'],84,[INK,TEAL],250);
  E.serv=[['nurse','Hamshira chaqirish'],['ambulance','Tez yordam chaqirish'],['vitamins','Vitaminlar va badlar'],['baby','Chaqaloqlar uchun'],['cosmetics',"Go'zallik va kosmetika"]].map(([im,l])=>{const b=div('','',undefined,20);
    b.innerHTML=`<div class="a" style="left:-150px;top:-150px;width:300px;height:300px;border-radius:150px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.08)"></div><img class="a" src="assets/img/${im}.png" style="left:-120px;top:-120px;width:240px;height:240px">`;
    const lab=div('mask','',undefined,30);const li=div('h',l,lab);S(li,{fontSize:'64px',color:INK,left:0,top:0});return {b,lab,li,w:tw(l,64)}});
  // S7 four steps
  headline('h7',["To'rt qadam",'va dori uyingizda.'],92,[WHITE,INK],230);
  E.st=['Qidiring',"Ro'yxat tuzing",'Dorixonani tanlang','Qabul qiling'].map((s,i)=>{const r=div('','',undefined,20);
    r.innerHTML=`<div class="a num h" style="left:0;top:0;width:150px;height:150px;border-radius:75px;background:#fff;color:${TEAL};font-size:84px;display:flex;align-items:center;justify-content:center;letter-spacing:0">${i+1}</div><div class="a mask" style="left:190px;top:18px;width:760px;height:120px"><div class="a h w" style="font-size:78px;color:#fff;left:0;top:14px">${s}</div></div>`;return r});
  // S8 outro
  E.word=div('mask','',undefined,31);E.wordI=div('h','Davo Delivery',E.word);S(E.wordI,{fontSize:'96px',fontWeight:800,color:INK,left:0,top:8});
  E.tag8=div('mask','',undefined,31);E.tag8I=div('','Sog‘lig‘ingiz uchun eng oson yo‘l',E.tag8);S(E.tag8I,{fontSize:'44px',fontWeight:600,color:'#737373',left:0,top:0,whiteSpace:'nowrap'});
  E.stores=['App Store','Google Play'].map(s=>{const p=div('pill',s,undefined,32);S(p,{height:96,width:330,background:INK,color:'#fff',fontSize:'38px'});return p});
}

// ---------------------------------------------------------------- seek(t)
let WORDW=0,TAGW=0,QW=[];
function seek(t){
  const L=$('L');[...L.children].forEach(c=>c.style.display='none');
  let bg=WHITE;const wipe=$('wipe');wipe.style.display='none';

  // ================= S1  logo build, then a push into the white cross (0 – 1.9)
  if(t<T.s2+.05){
    bg=BG;const L1=E.logo1;show(L1.svg.parentNode,1);
    const pk=[.18,.3,.42,.54].map(a=>spring(t-a,2.6,.42));const ck=spring(t-.72,3.0,.38);
    const push=ease.expoIn(P(t,1.22,.6));const u=lerp(5.2,5.2*42,push);
    poseLogo(L1,540,960,u,pk,ck);
  }
  // ================= S2  search (1.85 – 3.75)
  if(t>=T.s2&&t<T.s3+.05){
    setHeadline('h2',t,T.s2+.08,3.45);
    const bi=spring(t-(T.s2+.15),2.4,.55);show(E.bar,1);S(E.bar,{left:90,top:700,width:900,height:132,borderRadius:'66px',transform:`translateY(${(1-bi)*240}px) scale(${lerp(.8,1,bi)})`,border:`4px solid ${TEAL}`});
    const q='Paratsetamol',n=Math.round(clamp((t-(T.s2+.35))/.5)*q.length);$('q').textContent=q.slice(0,n);
    const cx=122+tw(q.slice(0,n),54,600,'Inter',0)+4;S($('caret'),{left:cx,opacity:(Math.floor(t*3)%2&&n>=q.length)?0:1});
    E.cards.forEach((c,i)=>{const k=spring(t-(T.s2+1.0+i*.12),2.2,.5);show(c,k>0);S(c,{left:90+i*470,top:930,width:430,height:430,transform:`translateY(${(1-k)*380}px) rotate(${(1-k)*(i?8:-8)}deg)`})});
    const tg=spring(t-(T.s2+1.3),3,.45);show(E.tag,tg>0);S(E.tag,{left:96,top:1400,transform:`scale(${tg})`,transformOrigin:'0 50%'});
    // exit: a teal circle grows from the first card's "+" (the next scene's colour)
    const wk=ease.expoIn(P(t,T.s3-.32,.36));if(wk>0){const r=wk*2100;show(wipe,1);S(wipe,{left:420-r,top:1298-r,width:2*r,height:2*r,background:TEAL})}
  }
  // ================= S3  map, pins, chips (3.7 – 5.55)
  if(t>=T.s3&&t<T.s4+.05){
    bg=TEAL;show(E.map.parentNode,1);
    const zoom=ease.expoIn(P(t,T.s4-.34,.36)),pin=E.pins[1];const zs=lerp(1,26,zoom);
    E.map.firstElementChild.parentNode.setAttribute('viewBox',`${pin.x-540/zs} ${pin.y-60-960/zs} ${1080/zs} ${1920/zs}`);
    [...E.map.querySelectorAll('#streets path')].forEach((p,i)=>{const L=p.getTotalLength?2600:2600;const k=ease.expoOut(P(t,T.s3+.05+i*.04,.5));p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-k)});
    E.pins.forEach((p,i)=>{const t0=T.s3+.3+i*.07,k=t-t0;if(k<0){p.g.style.display='none';return}p.g.style.display='';
      const fall=Math.min(1,k/.18),y=p.y-(1-fall*fall)*500,sq=k>.18?squash(k-.18,.35):[1/Math.sqrt(1.2),1.2];
      p.g.setAttribute('transform',`translate(${p.x} ${y}) scale(${sq[0]} ${sq[1]})`)});
    const you=E.map.querySelector('#you');you.setAttribute('transform',`translate(560 1060) scale(${spring(t-(T.s3+.2),3,.5)})`);
    const rp=((t-T.s3)*1.2)%1;E.map.querySelector('#ring').setAttribute('r',30+rp*90);E.map.querySelector('#ring').setAttribute('stroke-opacity',1-rp);
    setHeadline('h3',t,T.s3+.12,T.s4-.4);
    E.chips.forEach((c,i)=>{const p=E.pins[c.pi];const k=spring(t-(T.s3+.85+i*.14),2.8,.5)*(1-zoom);show(c.el,k>.01);const w=c.el.offsetWidth||220;
      S(c.el,{left:p.x-w/2,top:p.y-230,transform:`scale(${k})`,transformOrigin:'50% 100%'})});
  }
  // ================= S4  delivery route + status (5.5 – 7.35)
  if(t>=T.s4&&t<T.s5){
    setHeadline('h4',t,T.s4+.05,T.s5-.35);
    show(E.route.parentNode,1);const rt=E.route.querySelector('#rt2'),len=rt.getTotalLength();const run=ease.cubic(P(t,T.s4+.45,1.05));
    rt.style.strokeDasharray=`${len*run} ${len}`;
    const ph=spring(t-(T.s4+.1),2.6,.5);show(E.pharm,1);S(E.pharm,{left:120,top:700,transform:`scale(${ph})`});
    const hk=spring(t-(T.s4+.2),2.6,.5),arr=t>T.s4+1.5?squash(t-(T.s4+1.5),.3):[1,1];show(E.home.parentNode,1);E.home.querySelector('#house').setAttribute('transform',`translate(850 1430) scale(${hk*arr[0]} ${hk*arr[1]})`);
    const pt=rt.getPointAtLength(len*run),pt2=rt.getPointAtLength(Math.min(len,len*run+4));const ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI;
    const ck=spring(t-(T.s4+.3),2.8,.5);show(E.courier.parentNode,1);E.courier.querySelector('#cour').setAttribute('transform',`translate(${pt.x} ${pt.y-70}) scale(${ck}) rotate(${clamp(ang,-25,25)*.5})`);
