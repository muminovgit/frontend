<!doctype html>
<html><head><meta charset="utf-8">
<!-- Davo Delivery — Google Ads banners. One template, every size.
     ?f=1 (uploaded display, with text) | f=2 (responsive display, no text)
     &w=&h=  &t=1..5 (headline)  &c=mint|beige (palette)  &m=blur|clean (product list treatment)  &sc=home|home2|remind (f=2 screen) -->
<style>
@font-face{font-family:M;src:url(../assets/fonts/Montserrat-600.woff2);font-weight:600}
@font-face{font-family:M;src:url(../assets/fonts/Montserrat-800.woff2);font-weight:800}
@font-face{font-family:M;src:url(../assets/fonts/Montserrat-900.woff2);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff;overflow:hidden}
#ad{position:relative;overflow:hidden;font-family:M;color:#1d1430}
.logo{display:flex;align-items:center;gap:.4em;font-weight:800;white-space:nowrap;line-height:1.05}
.logo svg{flex:none;filter:drop-shadow(0 .08em .18em rgba(60,30,60,.15))}
.phone{position:absolute;background:#16131c;border-radius:16%/7.4%;padding:.32em;box-shadow:0 0 0 .06em #3a3644 inset,0 .9em 2.2em rgba(20,40,60,.28)}
.phone .scr{width:100%;height:100%;border-radius:13%/6%;overflow:hidden;position:relative;background:#fff}
.phone .scr img{width:100%;display:block}
.phone .isl{position:absolute;left:50%;top:2.6%;width:30%;height:2.6%;transform:translateX(-50%);background:#0b0a0f;border-radius:99px}
h1{font-weight:900;line-height:1.08;letter-spacing:-.01em}
p.s{font-weight:600;color:#5b5670;line-height:1.3}
p.s b{color:#1d1430;font-weight:800}
.cta{display:inline-flex;align-items:center;justify-content:center;background:#fb4669;color:#fff;font-weight:800;border-radius:99px;white-space:nowrap;box-shadow:0 .25em .7em rgba(251,70,105,.35)}
.note{position:absolute;color:#8a8698;font-weight:600;line-height:1.25}
.blob{position:absolute;border-radius:50%}
.kit{position:absolute;filter:drop-shadow(0 .4em .5em rgba(20,60,90,.25))}
.abs{position:absolute}
.ball{position:absolute;border-radius:50%;box-shadow:0 .5em 1.2em rgba(20,50,60,.18)}
</style></head>
<body><div id="ad"></div>
<script>
const Q=new URLSearchParams(location.search),W=+Q.get('w'),H=+Q.get('h'),F=+(Q.get('f')||1),T=+(Q.get('t')||1),
      C=Q.get('c')||'mint',M=Q.get('m')||'blur',SC=Q.get('sc')||'home';
const ad=document.getElementById('ad');ad.style.width=W+'px';ad.style.height=H+'px';document.body.style.width=W+'px';document.body.style.height=H+'px';
const PAL={
 mint:{bg:'radial-gradient(120% 90% at 85% 40%,#d8f4fd 0%,#effaf9 45%,#fbfdfd 100%)',bA:'rgba(94,205,240,.45)',bB:'rgba(255,206,104,.35)',
       wall:'linear-gradient(180deg,#e3f1f1,#d7ebea)',floor:'linear-gradient(180deg,#cfe4e2,#e4f0ef)',top:'linear-gradient(180deg,#f6fbfa,#eaf4f3)',side:'linear-gradient(90deg,#d5e8e6,#eef7f6 45%,#d2e5e3)',sh:'20,50,60'},
 beige:{bg:'radial-gradient(120% 90% at 85% 40%,#fde6d6 0%,#f8efe6 45%,#fcfaf7 100%)',bA:'rgba(255,183,140,.42)',bB:'rgba(255,206,104,.35)',
       wall:'linear-gradient(180deg,#f1e8de,#e8dccf)',floor:'linear-gradient(180deg,#dccdbc,#ece2d7)',top:'linear-gradient(180deg,#fbf7f2,#f2e9df)',side:'linear-gradient(90deg,#e1d3c3,#f6efe7 45%,#dccdbd)',sh:'70,45,25'}}[C];
const LOGO=s=>`<svg width="${s}" height="${s}" viewBox="-65.5 -65.5 131 131"><rect x="-65.5" y="-65.5" width="131" height="131" rx="31" fill="#fff"/>
<circle cx="-20" cy="-20" r="28.5" fill="#ffce68"/><circle cx="20" cy="-20" r="28.5" fill="#fb4669"/><circle cx="-20" cy="20" r="28.5" fill="#5e3a9a"/><circle cx="20" cy="20" r="28.5" fill="#01bdac"/>
<path d="M-10.5-29h21v18.5h18.5v21h-18.5v18.5h-21v-18.5h-18.5v-21h18.5z" fill="#fff"/></svg>`;
// copy from the brief; hs = short line for the 320x50 strip (no claims there: no room for the footnote)
const TX={1:{h:'Dorixona izlamang!',s:'Dorilarni <b>30 daqiqada*</b> yetkazamiz',hs:'Dorixona izlamang!',note:1},
          2:{h:'Narxlarni ilovada solishtiring',s:'Dori narxlarini solishtirib buyurtma bering',hs:'Narxlarni solishtiring'},
          3:{h:'Uydan chiqish shart emas!',s:'Dori kerak bo‘lganda ilovada buyurtma bering',hs:'Uydan chiqish shart emas!'},
          4:{h:'Uydan chiqmay dori oling',s:'Litsenziyali, ishonchli, tezkor',hs:'Uydan chiqmay dori oling'},
          5:{h:'Dorilarni uyingizga yetkazamiz',s:'Ilovani yuklab oling',hs:'Dorilar uyingizga'}}[T];
const NOTE='*Yetkazish vaqti hududga qarab farq qilishi mumkin';
const scr=k=>`screens/${k}-${M}.png`;
function phone(x,y,w,rot=0,k='home'){return `<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${w*2.05}px;transform:rotate(${rot}deg);font-size:${w/10}px"><div class="scr"><img src="${scr(k)}"></div><div class="isl"></div></div>`}
function blobs(){return `<div class="blob" style="left:${W*.62}px;top:${-H*.25}px;width:${Math.max(W,H)*.6}px;height:${Math.max(W,H)*.6}px;background:radial-gradient(closest-side,${PAL.bA},transparent)"></div>
<div class="blob" style="left:${W*.7}px;top:${H*.6}px;width:${Math.max(W,H)*.45}px;height:${Math.max(W,H)*.45}px;background:radial-gradient(closest-side,${PAL.bB},transparent)"></div>`}
const note=(css,fs)=>TX.note?`<span class="note" style="${css};font-size:${fs}px">${NOTE}</span>`:'';
let html='',fits=[];   // fits: [selector, maxW, maxH] — shrink font until the text block fits
if(F===1){ad.style.background=PAL.bg;const r=W/H;
  if(r>2.6&&W>=600){ // 728x90 leaderboard
    const u=H/90;
    html=blobs()+`<div class="logo abs" style="left:${16*u}px;top:50%;transform:translateY(-50%);font-size:${15*u}px">${LOGO(44*u)}<span>Davo<br>Delivery</span></div>
    <div class="abs" id="tb" style="left:${150*u}px;top:${TX.note?10*u:0}px;bottom:${TX.note?18*u:0}px;width:${W-150*u-300*u}px;display:flex;flex-direction:column;justify-content:center">
      <h1 style="font-size:${26*u}px">${TX.h}</h1><p class="s" style="font-size:${13*u}px;margin-top:${3*u}px">${TX.s}</p></div>
    ${phone(W-262*u,10*u,92*u,-10)}
    <span class="cta abs" style="right:${22*u}px;top:50%;transform:translateY(-50%);font-size:${14*u}px;padding:${10*u}px ${18*u}px">Yuklab olish</span>
    ${note(`left:${150*u}px;bottom:${4*u}px`,7.5*u)}`;fits.push(['#tb',W-150*u-300*u,H-(TX.note?28*u:0)]);
  } else if(r>2.6||(r>=3&&W<600)||(W===320&&H===100)){ // 320x50 / 320x100 mobile strips
    const big=H>=80, ls=big?50:34;
    html=blobs()+`<div class="logo abs" style="left:${big?12:8}px;top:50%;transform:translateY(-50%)">${LOGO(ls)}</div>
    <div class="abs" id="tb" style="left:${(big?12:8)+ls+8}px;top:${big?(TX.note?8:0):0}px;bottom:${big&&TX.note?15:0}px;width:${W-(big?12:8)-ls-8-(big?104:92)}px;display:flex;flex-direction:column;justify-content:center">
      <h1 style="font-size:${big?18:14}px">${big?TX.h:TX.hs}</h1>${big?`<p class="s" style="font-size:10px;margin-top:2px">${TX.s}</p>`:''}</div>
    <span class="cta abs" style="right:${big?10:8}px;top:50%;transform:translateY(-50%);font-size:${big?12:11}px;padding:${big?'9px 13px':'7px 11px'}">Yuklab olish</span>
    ${big?note(`left:${12+ls+8}px;bottom:5px`,6.5):''}`;
    fits.push(['#tb',W-(big?12:8)-ls-8-(big?104:92),H-(big&&TX.note?23:0)]);
  } else if(H/W>1.5){ // 300x600 / 160x600 skyscrapers
    const k=W/300, nar=W<200, pad=nar?12:20;
    const hs=nar?20:30, ss=nar?11.5:15, pw=nar?110:150, ph=pw*2.05, ctaB=TX.note?(nar?44:38):18;
    html=blobs()+`<div class="logo abs" style="left:0;right:0;justify-content:center;top:${nar?16:20}px;font-size:${nar?11:14}px">${LOGO(nar?26:32)}<span>Davo Delivery</span></div>
    <div class="abs" id="tb" style="left:${pad}px;right:${pad}px;top:${nar?58:72}px;text-align:center"><h1 style="font-size:${hs}px">${TX.h}</h1><p class="s" style="font-size:${ss}px;margin-top:${nar?7:9}px">${TX.s}</p></div>
    ${phone(W/2-pw/2+(nar?0:10),H*(nar?.40:.39),pw,nar?4:6)}
    <img class="kit" src="../assets/aidkit.png" style="left:${nar?W*.02:W*.05}px;top:${H*(nar?.62:.60)}px;width:${nar?70:110}px">
    <span class="cta abs" style="left:${pad}px;right:${pad}px;bottom:${ctaB}px;font-size:${nar?12:15}px;padding:${nar?11:13}px 0">Yuklab olish →</span>
    ${note(`left:${pad}px;right:${pad}px;text-align:center;bottom:${nar?8:10}px`,nar?7:8)}`;
    fits.push(['#tb',W-2*pad,H*(nar?.40:.39)-(nar?66:80)]);
  } else { // 300x250 / 336x280 rectangles
    const u=Math.min(W/300,H/250);
    html=blobs()+`<div class="logo abs" style="left:${16*u}px;top:${15*u}px;font-size:${11*u}px">${LOGO(24*u)}<span>Davo Delivery</span></div>
    <div class="abs" style="left:${16*u}px;top:${52*u}px;width:${W*.56}px"><div id="tb"><h1 style="font-size:${22*u}px">${TX.h}</h1>
      <p class="s" style="font-size:${11.5*u}px;margin-top:${7*u}px">${TX.s}</p></div>
      <span class="cta" style="margin-top:${12*u}px;font-size:${11.5*u}px;padding:${8*u}px ${15*u}px">Yuklab olish →</span></div>
    ${phone(W-108*u,52*u,100*u,8)}
    <img class="kit" src="../assets/aidkit.png" style="left:${W-150*u}px;top:${H-82*u}px;width:${78*u}px">
    ${note(`left:${16*u}px;bottom:${7*u}px;width:${W*.52}px`,7*u)}`;
    fits.push(['#tb',W*.56,H-52*u-(TX.note?30:12)*u-40*u]);
  }
} else if(F===3){ // ---------- logos for responsive display ads (1:1 and 4:1), on white
  ad.style.background='#fff';
  html=W===H?`<div class="abs" style="inset:0;display:grid;place-items:center">${LOGO(W*.78)}</div>`
   :`<div class="logo abs" style="inset:0;justify-content:center;font-size:${H*.36}px;gap:${H*.12}px;font-weight:900;color:#1d1430">${LOGO(H*.78)}<span style="white-space:nowrap">Davo Delivery</span></div>`;
} else { // ---------- format 2: studio mockup, no text
  const cx=W/2, podTop=H*(W>H*1.5?.70:.72), ph=H*(W>H*1.5?.64:W>=H?.62:.55), pw=ph/2.05, podW=Math.min(pw*2.2,W*.9), u=pw/196, sh=PAL.sh;
  const balls=[['#fff3c9,#ffce68 45%,#d99a2b',.79,.26,70],['#ffc0cc,#fb4669 45%,#c41e45',.19,.40,46],['#b5fff6,#01bdac 45%,#007d72',.82,.57,34],['#c9b3f0,#5e3a9a 45%,#341b5e',.26,.17,26]];
  html=`<div class="abs" style="inset:0;background:${PAL.wall}"></div>
  <div class="abs" style="inset:0;background:linear-gradient(118deg,transparent 0 38%,rgba(255,255,255,.75) 38% 47%,transparent 47% 52%,rgba(255,255,255,.6) 52% 60%,transparent 60%);filter:blur(${14*u}px)"></div>
  <div class="abs" style="left:0;right:0;bottom:0;height:${H*.22}px;background:${PAL.floor}"></div>
  ${balls.map(([g,x,y,s])=>`<div class="ball" style="left:${W*x-s*u/2}px;top:${H*y}px;width:${s*u}px;height:${s*u}px;font-size:${20*u}px;background:radial-gradient(circle at 35% 30%,${g})"></div>`).join('')}
  <div class="abs" style="left:${cx-podW/2}px;top:${podTop}px;width:${podW}px;height:${H-podTop+40}px;background:${PAL.side}"></div>
  <div class="abs" style="left:${cx-podW/2}px;top:${podTop-podW*.098}px;width:${podW}px;height:${podW*.196}px;border-radius:50%;background:${PAL.top}"></div>
  <div class="abs" style="left:${cx-pw*.8}px;top:${podTop-podW*.06}px;width:${pw*1.6}px;height:${podW*.1}px;border-radius:50%;background:radial-gradient(closest-side,rgba(${sh},.35),transparent);filter:blur(${6*u}px)"></div>
  <div class="abs" style="left:${cx-pw/2}px;top:${podTop-ph-6*u}px;width:${pw}px;height:${ph}px;perspective:${1400*u}px">
    <div style="width:100%;height:100%;transform:rotateY(-14deg) rotateX(2deg);transform-origin:50% 100%;position:relative">${phone(0,0,pw,0,SC)}</div></div>`;
}
ad.innerHTML=html;
document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r)))).then(()=>{
  for(const [sel,mw,mh] of fits){const el=document.querySelector(sel);let g=0;
    while((el.scrollWidth>mw+.5||el.scrollHeight>mh+.5)&&g++<40)el.querySelectorAll('h1,p').forEach(n=>n.style.fontSize=(parseFloat(n.style.fontSize)*.95)+'px')}
  window.READY=true});
</script></body></html>
