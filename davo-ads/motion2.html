<!doctype html><html><head><meta charset="utf-8"><title>Davo — Motion 2 "Tibbiy uskunalar"</title><style>
@font-face{font-family:"Montserrat";src:url(assets/fonts/Montserrat-600.woff2);font-weight:600}
@font-face{font-family:"Montserrat";src:url(assets/fonts/Montserrat-800.woff2);font-weight:800}
@font-face{font-family:"Montserrat";src:url(assets/fonts/Montserrat-900.woff2);font-weight:900}
@font-face{font-family:"Inter";src:url(assets/fonts/Inter-500.woff2);font-weight:500}
@font-face{font-family:"Inter";src:url(assets/fonts/Inter-600.woff2);font-weight:600}
@font-face{font-family:"Inter";src:url(assets/fonts/Inter-700.woff2);font-weight:700}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Davo Delivery — Motion 2 "Tibbiy uskunalar" (7.5 s). Concept: clinical blueprint — an ECG line opens the piece,
// devices are DRAWN as technical line art in a search-result carousel, then filled. Every pixel = f(t).
const W=1080,H=1920,DUR=7.5;
const Y='#ffce68',PK='#fb4669',VI='#5e3a9a',G='#01bdac',BLUE='#2f6bff',WH='#ffffff',INK='#0f1b2d',SKY='#eaf3ff',LINE='#2f6bff',SCR='#0b3b4a';
const T={ecg:0,head:.55,search:1.15,car:1.75,step:.55,bul:4.55,cta:5.75};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,s,d)=>clamp((t-s)/d),lerp=(a,b,k)=>a+(b-a)*k;
const E={out:k=>1-Math.pow(1-k,3),io:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,expo:k=>k>=1?1:1-Math.pow(2,-10*k),expoIn:k=>k<=0?0:Math.pow(2,10*k-10)};
function spring(t,f=2.4,z=.5){if(t<=0)return 0;const w=2*Math.PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const F=(w,s,f='Montserrat')=>`${w} ${s}px "${f}"`;
function txt(s,x,y,size,o={}){ctx.save();ctx.globalAlpha*=o.a??1;ctx.font=F(o.w??900,size,o.f);ctx.textAlign=o.al??'center';ctx.textBaseline='middle';ctx.fillStyle=o.c??INK;ctx.fillText(s,x,y);ctx.restore()}
function tw(s,size,w=900,f='Montserrat'){ctx.save();ctx.font=F(w,size,f);const v=ctx.measureText(s).width;ctx.restore();return v}
function fit(s,maxW,start,w=900){let z=start;while(tw(s,z,w)>maxW&&z>20)z-=4;return z}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function flash(a,c='#fff'){if(a<=0)return;ctx.save();ctx.globalAlpha=clamp(a);ctx.fillStyle=c;ctx.fillRect(-80,-80,W+160,H+160);ctx.restore()}
function check(x,y,s,k,col,lw){if(k<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';const p=[[-.5,0],[-.15,.35],[.55,-.4]],L1=Math.hypot(.35,.35),L2=Math.hypot(.7,.75),tot=(L1+L2)*k;
  ctx.beginPath();ctx.moveTo(x+p[0][0]*s,y+p[0][1]*s);if(tot<=L1){const q=tot/L1;ctx.lineTo(x+lerp(p[0][0],p[1][0],q)*s,y+lerp(p[0][1],p[1][1],q)*s)}else{ctx.lineTo(x+p[1][0]*s,y+p[1][1]*s);const q=(tot-L1)/L2;ctx.lineTo(x+lerp(p[1][0],p[2][0],q)*s,y+lerp(p[1][1],p[2][1],q)*s)}ctx.stroke();ctx.restore()}
function cross(u){const a=10.5*u,b=29*u;ctx.beginPath();ctx.moveTo(-a,-b);ctx.lineTo(a,-b);ctx.lineTo(a,-a);ctx.lineTo(b,-a);ctx.lineTo(b,a);ctx.lineTo(a,a);ctx.lineTo(a,b);ctx.lineTo(-a,b);ctx.lineTo(-a,a);ctx.lineTo(-b,a);ctx.lineTo(-b,-a);ctx.lineTo(-a,-a);ctx.closePath()}
function logo(x,y,s,a=1,bloom=1){ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.fillStyle=WH;ctx.shadowColor='rgba(15,27,45,.18)';ctx.shadowBlur=s*.18;ctx.shadowOffsetY=s*.05;rr(-s/2,-s/2,s,s,s*.24);ctx.fill();ctx.shadowColor='transparent';const u=s/131;
  [[Y,-1,-1],[PK,1,-1],[VI,-1,1],[G,1,1]].forEach(([c,sx,sy],i)=>{const k=clamp(bloom*1.5-i*.12);if(k<=0)return;ctx.fillStyle=c;ctx.beginPath();ctx.arc(sx*20*u*k,sy*20*u*k,28.5*u*E.out(k),0,7);ctx.fill()});ctx.fillStyle=WH;ctx.save();const c=clamp(bloom*1.3-.3);ctx.scale(c,c);cross(u);ctx.fill();ctx.restore();ctx.restore()}
const BEATS=[T.ecg+.35,T.car,T.car+T.step,T.car+2*T.step,T.car+3*T.step,T.car+4*T.step,T.bul,T.bul+.18,T.bul+.36,T.cta+.05];
function shake(t){let x=0,y=0;for(const k of[T.head,T.cta+.05]){const d=t-k;if(d<0||d>.5)continue;const e=12*Math.exp(-d*12);x+=e*Math.sin(d*90);y+=e*Math.cos(d*70)}return[x,y]}

// ---------------------------------------------------------------- background: clinical blueprint grid
function bg(t){ctx.fillStyle=SKY;ctx.fillRect(-80,-80,W+160,H+160);ctx.save();ctx.strokeStyle='rgba(47,107,255,.07)';ctx.lineWidth=2;const o=(t*20)%60;
  for(let x=-60+o;x<W+60;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-60+o;y<H+60;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.strokeStyle='rgba(47,107,255,.12)';for(let x=-240+o*4%240;x<W+240;x+=240){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.restore();
  const rg=ctx.createRadialGradient(540,1050,0,540,1050,900);rg.addColorStop(0,'rgba(255,255,255,.85)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(-80,-80,W+160,H+160)}

// ---------------------------------------------------------------- ECG opener: the line runs across, its spike lands where the headline pops
function ecgY(x){const p=((x-60)/240)%1;if(p<.38)return 0;if(p<.42)return -18*(p-.38)/.04;if(p<.46)return lerp(-18,180,(p-.42)/.04);if(p<.5)return lerp(180,-260,(p-.46)/.04);if(p<.55)return lerp(-260,40,(p-.5)/.05);if(p<.6)return lerp(40,0,(p-.55)/.05);if(p<.7)return 0;if(p<.78)return -50*Math.sin((p-.7)/.08*Math.PI);return 0}
function ecg(t){const head=E.io(P(t,0,.7)),out=E.expoIn(P(t,T.head,.35));if(out>=1)return;const y0=960,xe=lerp(-40,1120,head);ctx.save();ctx.globalAlpha=1-out;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(1,189,172,.25)';ctx.lineWidth=26;ctx.beginPath();for(let x=-40;x<=xe;x+=4){const y=y0+ecgY(x+40);x<=-36?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
  ctx.strokeStyle=G;ctx.lineWidth=10;ctx.stroke();ctx.fillStyle=WH;ctx.beginPath();ctx.arc(xe,y0+ecgY(xe+40),14,0,7);ctx.fill();ctx.restore()}

// ---------------------------------------------------------------- devices: line art that draws on, then fills
// Each device is a list of [path builder, fill colour]. draw(k): k in 0..1 -> stroke progress then fill.
function strokeOn(build,k,col,lw){if(k<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash([1600*k,1600]);build();ctx.stroke();ctx.restore()}
function part(build,fill,k,f){strokeOn(build,clamp(k*1.6),LINE,6);if(f>0){ctx.save();ctx.globalAlpha=f;build();ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='rgba(15,27,45,.12)';ctx.stroke();ctx.restore()}}
function lcd(x,y,w,h,s,f,size){if(f<=0)return;ctx.save();ctx.globalAlpha=f;rr(x,y,w,h,14);ctx.fillStyle=SCR;ctx.fill();txt(s,x+w/2,y+h/2+3,size,{c:'#6ff2e0',f:'Inter',w:700});ctx.restore()}
const DEV=[
 ['Tonometr',(k,f)=>{part(()=>{ctx.beginPath();ctx.roundRect(-170,-40,200,170,34)},'#ffffff',k,f);lcd(-150,-20,160,82,'120/80',f,40);
   part(()=>{ctx.beginPath();ctx.roundRect(40,-120,140,280,60)},'#b9c7dc',k,f);part(()=>{ctx.beginPath();ctx.moveTo(30,40);ctx.bezierCurveTo(90,40,60,-60,110,-60)},'rgba(0,0,0,0)',k,0);
   if(f>0){ctx.save();ctx.globalAlpha=f;ctx.strokeStyle='#6b7a90';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(30,40);ctx.bezierCurveTo(90,40,60,-60,110,-60);ctx.stroke();ctx.fillStyle=G;rr(-140,80,60,30,15);ctx.fill();ctx.restore()}}],
 ['Termometr',(k,f)=>{ctx.save();ctx.rotate(-.5);part(()=>{ctx.beginPath();ctx.roundRect(-40,-210,80,360,40)},'#ffffff',k,f);part(()=>{ctx.beginPath();ctx.roundRect(-14,150,28,90,14)},'#c9d3e2',k,f);lcd(-28,-150,56,130,'',f,1);
   if(f>0){ctx.save();ctx.globalAlpha=f;ctx.translate(0,-85);ctx.rotate(Math.PI/2);txt('36.6',0,3,34,{c:'#6ff2e0',f:'Inter',w:700});ctx.restore();ctx.fillStyle=G;ctx.globalAlpha=f;ctx.beginPath();ctx.arc(0,60,16,0,7);ctx.fill()}ctx.restore()}],
 ['Glyukometr',(k,f)=>{part(()=>{ctx.beginPath();ctx.roundRect(-130,-150,260,320,70)},'#ffffff',k,f);lcd(-90,-100,180,120,'5.4',f,64);part(()=>{ctx.beginPath();ctx.roundRect(-34,-230,68,100,8)},'#ffce68',k,f);
   if(f>0){ctx.save();ctx.globalAlpha=f;ctx.fillStyle='#e7edf6';ctx.beginPath();ctx.arc(0,95,40,0,7);ctx.fill();ctx.fillStyle=G;ctx.beginPath();ctx.arc(0,95,22,0,7);ctx.fill();ctx.restore()}}],
 ['Pulsoksimetr',(k,f)=>{part(()=>{ctx.beginPath();ctx.roundRect(-180,-40,360,150,70)},'#c9d3e2',k,f);part(()=>{ctx.beginPath();ctx.roundRect(-170,-150,340,140,64)},'#ffffff',k,f);lcd(-120,-125,240,90,'98  72',f,48);
   if(f>0){ctx.save();ctx.globalAlpha=f;ctx.fillStyle=PK;ctx.beginPath();ctx.arc(150,-80,10,0,7);ctx.fill();ctx.restore()}}],
 ['Ingalyator',(k,f)=>{part(()=>{ctx.beginPath();ctx.roundRect(-190,-20,250,190,40)},'#ffffff',k,f);part(()=>{ctx.beginPath();ctx.ellipse(130,-110,70,90,.2,0,7)},'#dff4f1',k,f);
   if(f>0){ctx.save();ctx.globalAlpha=f;ctx.strokeStyle='#8fa0b8';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(60,60);ctx.bezierCurveTo(140,60,150,10,130,-30);ctx.stroke();ctx.fillStyle=G;rr(-160,10,90,40,20);ctx.fill();ctx.fillStyle='#e7edf6';ctx.beginPath();ctx.arc(-20,110,26,0,7);ctx.fill();ctx.restore()}}],
];
// ---------------------------------------------------------------- search + carousel
function searchCar(t){const out=E.expoIn(P(t,T.bul-.2,.35));if(t<T.search||out>=1)return;const k=spring(t-T.search,2,.62);ctx.save();ctx.globalAlpha=clamp(k*1.4)*(1-out);ctx.translate(0,(1-Math.min(1,k))*120-out*160);
  const bw=lerp(140,920,clamp(k)),bx=540-bw/2,by=640;ctx.fillStyle=WH;ctx.shadowColor='rgba(15,27,45,.12)';ctx.shadowBlur=40;ctx.shadowOffsetY=12;rr(bx,by,bw,120,60);ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=BLUE;ctx.lineWidth=4;rr(bx,by,bw,120,60);ctx.stroke();
  ctx.strokeStyle=INK;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.arc(bx+64,by+56,18,0,7);ctx.moveTo(bx+78,by+70);ctx.lineTo(bx+92,by+84);ctx.stroke();
  const q='Tibbiy uskunalar',ty=P(t,T.search+.2,.5),s=q.slice(0,Math.round(ty*q.length));if(k>.6){ctx.save();ctx.beginPath();ctx.rect(bx,by,bw,120);ctx.clip();txt(s+(ty<1||Math.floor(t*3)%2?'|':''),bx+120,by+62,46,{al:'left',w:600,f:'Inter',c:INK});ctx.restore()}
  // cover-flow carousel
  const raw=(t-T.car)/T.step,fl=Math.floor(raw),pos=raw<0?0:Math.min(DEV.length-1,fl+E.io(clamp((raw-fl-.5)/.5)));if(t>=T.car-.25){const cy=1180;for(let i=0;i<DEV.length;i++){const d=i-clamp(pos,0,DEV.length-1)-(pos<0?0:0),ad=Math.abs(d);if(ad>1.6)continue;
      const enter=E.out(P(t,T.car-.25+Math.max(0,i-1)*.05,.4)),x=540+d*560,sc=lerp(1,.62,Math.min(1,ad)),a=clamp(1.6-ad)*enter;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,cy);ctx.scale(sc,sc);
      ctx.fillStyle=WH;ctx.shadowColor='rgba(15,27,45,.16)';ctx.shadowBlur=60;ctx.shadowOffsetY=24;rr(-300,-330,600,660,56);ctx.fill();ctx.shadowColor='transparent';
      const local=t-(T.car+(i-1)*T.step+T.step*.75),dk=i===0?E.io(P(t,T.car-.25,.35)):lerp(.5,1,E.io(clamp(local/.3))),fk=i===0?E.out(P(t,T.car+.05,.2)):E.out(clamp((local-.2)/.2));ctx.save();ctx.translate(0,-50);DEV[i][1](dk,fk);ctx.restore();
      txt(DEV[i][0],0,215,48,{w:900});ctx.save();ctx.globalAlpha*=fk;rr(-170,252,340,52,26);ctx.fillStyle='rgba(1,189,172,.14)';ctx.fill();txt('✓ Dorixonalarda mavjud',0,280,26,{w:700,f:'Inter',c:'#01857a'});ctx.restore();ctx.restore()}
    // dots
    for(let i=0;i<DEV.length;i++){const on=Math.round(pos)===i;ctx.fillStyle=on?BLUE:'rgba(47,107,255,.25)';rr(540-(DEV.length*34)/2+i*34+(on?-6:0),1580,on?32:20,12,6);ctx.fill()}}
  ctx.restore()}

// ---------------------------------------------------------------- headline, bullets, CTA
function headline(t){if(t<T.head)return;const L=[['Tibbiy uskunalarni',INK],['uyingizga',WH,BLUE],['yetkazib beramiz.',INK]];const sh=E.io(P(t,T.cta-.3,.35));
  L.forEach(([s,c,hl],i)=>{const t0=T.head+i*.09,k=spring(t-t0,2.6,.5);if(t<t0)return;const z=fit(s,960,i===1?96:84);ctx.save();ctx.globalAlpha=1-sh;ctx.translate(540,300+i*104-sh*60);const sc=lerp(.35,1,Math.min(1.12,k));ctx.scale(sc,sc);
    if(hl){const ww=tw(s,z)+48,hk=E.out(P(t,t0+.15,.25));ctx.fillStyle=hl;rr(-ww/2,-z*.62,ww*hk,z*1.24,z*.26);ctx.fill()}txt(s,0,4,z,{c});ctx.restore()})}
const BUL=[['Faqat litsenziyali mahsulotlar',G],['Eng arzonini tanlang',Y],['24/7 yetkazib berish*',PK]];
function bullets(t){if(t<T.bul)return;const out=E.expoIn(P(t,T.cta-.15,.3));BUL.forEach(([s,c],i)=>{const t0=T.bul+i*.18,k=E.expo(P(t,t0,.4));if(k<=0)return;const y=760+i*170;
  ctx.save();ctx.globalAlpha=k*(1-out);ctx.translate((1-k)*(i%2?900:-900),-out*100);ctx.fillStyle=WH;ctx.shadowColor='rgba(15,27,45,.1)';ctx.shadowBlur=36;ctx.shadowOffsetY=12;rr(90,y,900,136,68);ctx.fill();ctx.shadowColor='transparent';
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(170,y+68,44,0,7);ctx.fill();check(170,y+72,46,P(t,t0+.12,.25),i===1?INK:WH,9);txt(s,240,y+70,fit(s,700,50,800),{al:'left',w:800});ctx.restore()});
  // ECG trace under the bullets (echo of the opener)
  const ek=E.io(P(t,T.bul,.9));ctx.save();ctx.globalAlpha=(1-out)*.6;ctx.strokeStyle=G;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();for(let x=60;x<=lerp(60,1020,ek);x+=4){const y=1340+ecgY(x)*.35;x===60?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.restore()}
function cta(t){if(t<T.cta)return;const u=t-T.cta;logo(540,820,250,clamp(u/.1),E.out(P(u,.05,.45)));for(let r=0;r<2;r++){const q=P(u,.15+r*.07,.6);if(q>0&&q<1){ctx.save();ctx.strokeStyle=r?G:BLUE;ctx.globalAlpha=1-q;ctx.lineWidth=12*(1-q)+2;ctx.beginPath();ctx.arc(540,820,160+E.out(q)*480,0,7);ctx.stroke();ctx.restore()}}
  const nk=E.expo(P(u,.2,.45));ctx.save();ctx.beginPath();ctx.rect(0,990,W,200);ctx.clip();txt('Davo Delivery',540,1070+(1-nk)*150,104,{c:INK});ctx.restore();
  const bk=spring(u-.35,2,.55);ctx.save();ctx.translate(540,1260);ctx.scale(bk,bk);ctx.fillStyle=BLUE;ctx.shadowColor='rgba(47,107,255,.45)';ctx.shadowBlur=40;rr(-440,-76,880,152,76);ctx.fill();ctx.shadowColor='transparent';
  txt('Ilovani yuklab oling',0,4,fit('Ilovani yuklab oling',760,58,800),{w:800,c:WH});ctx.restore();
  const sk=E.out(P(u,.6,.35));['App Store','Google Play'].forEach((s,i)=>{const x=i?700:380;ctx.save();ctx.globalAlpha=sk;rr(x-150,1390,300,68,34);ctx.fillStyle=INK;ctx.fill();txt(s,x,1425,32,{w:700,f:'Inter',c:WH});ctx.restore()})}
function foot(t){if(t<T.bul)return;txt('*Yetkazish vaqti va ish tartibi hudud va buyurtmaga qarab farq qilishi mumkin.',540,1650,21,{w:500,f:'Inter',c:'rgba(15,27,45,.6)',a:E.out(P(t,T.bul+.3,.4))})}

function draw(t){ctx.setTransform(1,0,0,1,0,0);bg(t);const[sx,sy]=shake(t);ctx.translate(sx,sy);ecg(t);headline(t);searchCar(t);bullets(t);cta(t);foot(t);
  ctx.setTransform(1,0,0,1,0,0);flash((1-P(t,T.cta,.14))*(t>=T.cta?.7:0));flash(E.expoIn(P(t,DUR-.3,.3)),SKY)}
window.ready=(async()=>{await Promise.all(['900 90px Montserrat','800 90px Montserrat','600 90px Montserrat','500 30px Inter','600 30px Inter','700 30px Inter'].map(f=>document.fonts.load(f,"Oʻ‘’'✓")));draw(0);return true})();
window.seek=t=>draw(Math.min(Math.max(t,0),DUR-1e-4));window.DUR=DUR;
</script></body></html>
