// capsule field -> DNA helix

function drawScreen(k,scroll){const c=SCR.getContext('2d'),w=720,h=1480;c.fillStyle='#f5f6fa';c.fillRect(0,0,w,h);c.fillStyle='#e6f7fb';c.fillRect(0,0,w,330);
  txt(c,'9:41',70,48,28,{w:700,f:'Inter',c:INK});c.fillStyle=WH;rr(c,36,96,w-72,86,43);c.fill();txt(c,'Izlash',110,140,30,{al:'left',w:600,f:'Inter',c:'#8a8f99'});

    c.fillStyle=WH;rr(c,x,y,312,350,30);c.fill();c.fillStyle=c1;rr(c,x+96,y+40,120,170,22);c.fill();c.fillStyle=c2;rr(c,x+96,y+30,120,36,12);c.fill();c.fillStyle='rgba(255,255,255,.85)';rr(c,x+108,y+100,96,50,10);c.fill();

  let sx=0,sy=0;for(const k of[.22,.42,1,1.5,2,2.5,3,9,10,11,12.95]){const d=t-k;if(d<0||d>.5)continue;const e=16*Math.exp(-d*12);sx+=e*Math.sin(d*90);sy+=e*Math.cos(d*70)}

  const B=bctx;let prev='#120c1c',cur=bgAt(t),tc=0;for(const[s,col]of BGS){if(t>=s){if(s>0){tc=s}}}for(let i=1;i<BGS.length;i++)if(BGS[i][0]===tc)prev=BGS[i-1][1];

    txt(B,WORDS[i],540,1560,fit(B,WORDS[i],960,150),{c:i===0?INK:WH,a:E.out(P(u,0,.12))})}
