<!doctype html>
<html><head><meta charset="utf-8"><title>Invirep previz</title>
<style>
@font-face{font-family:"Fira";src:url(lib/FiraSansCond-600-lat.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Fira";src:url(lib/FiraSansCond-600-cyr.woff2) format("woff2");font-weight:600;unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script src="lib/three.global.js"></script>
<script>
// Invirep v2 "Bir tomchining yo'li" — 3D previz / layout animatic for video-to-video.
// Deterministic: every frame is a pure function of t (window.seek). 7 shots, 9:16.
const W=1080,H=1920;
const SH=[[0,3],[3,6],[6,10],[10,14],[14,18],[18,22],[22,25.5]],DUR=25.5;
const C={amber:0x6e2c0c,green:0x0d4a35,teal:0x0E5E57,pink:0xF2A7C3,pinkD:0xD9619A,white:0xffffff,skinF:0xF3CDAE,skinM:0xE3AE88,hair:0x3B2A22};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,s,d)=>clamp((t-s)/d),lerp=(a,b,k)=>a+(b-a)*k;
const E={io:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,out:k=>1-Math.pow(1-k,3),in:k=>k*k*k,expo:k=>k>=1?1:1-Math.pow(2,-10*k)};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const cam=new THREE.PerspectiveCamera(38,W/H,.02,600);

// ---------------------------------------------------------------- textures
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
function drawHand(g,x,y,s,rot){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);const gr=g.createLinearGradient(-60,0,60,0);gr.addColorStop(0,'#F6C3D6');gr.addColorStop(1,'#D9619A');g.fillStyle=gr;
  g.beginPath();g.moveTo(-70,20);g.bezierCurveTo(-40,-5,0,-15,30,-18);g.lineTo(62,-24);g.quadraticCurveTo(72,-24,70,-14);g.lineTo(34,-6);g.lineTo(70,-8);g.quadraticCurveTo(80,-6,74,4);g.lineTo(36,8);g.lineTo(66,10);g.quadraticCurveTo(76,14,68,22);g.lineTo(32,22);g.lineTo(54,30);g.quadraticCurveTo(60,38,50,40);g.bezierCurveTo(20,34,-20,40,-70,38);g.closePath();g.fill();
  g.strokeStyle='#fff';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(-10,-4);g.lineTo(22,-10);g.moveTo(-8,12);g.lineTo(24,8);g.stroke();g.restore()}
function labelTex(){return canvasTex(1400,560,(g,w,h)=>{g.fillStyle='#fbfbfb';g.fillRect(0,0,w,h);
  g.fillStyle='#0E5E57';g.font='600 150px Fira';g.textAlign='center';g.textBaseline='alphabetic';g.fillText('Инвиреп',w/2,175);g.font='600 26px Fira';g.fillText('®',w/2+265,95);
  g.fillStyle='#55606a';g.font='600 32px Fira';g.fillText('Противовирусное и',w/2,240);g.fillText('иммуномодулирующее средство',w/2,280);
  drawHand(g,w/2,380,1.6,-.25);g.fillStyle='#0E5E57';g.font='600 34px Fira';g.fillText('SPRING PHARMACEUTIC',w/2+30,520);
  g.strokeStyle='#0E5E57';g.lineWidth=5;g.strokeRect(w/2-215,488,40,40)})}
const LABEL=labelTex();
const RIBS=canvasTex(512,64,(g,w,h)=>{g.fillStyle='#f4f4f4';g.fillRect(0,0,w,h);g.fillStyle='#dcdcdc';for(let x=0;x<w;x+=16)g.fillRect(x,0,5,h)});
const PIYOLA=canvasTex(1024,256,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle='#1d3f9a';g.fillRect(0,0,w,26);g.fillRect(0,h-20,w,20);
  for(let i=0;i<10;i++){const x=i*w/10+50;g.beginPath();g.ellipse(x,120,26,34,0,0,7);g.fill();g.beginPath();g.ellipse(x-30,150,18,24,-.6,0,7);g.fill();g.beginPath();g.ellipse(x+30,150,18,24,.6,0,7);g.fill();g.fillRect(x-3,160,6,50)}});
function boxTex(){return canvasTex(700,950,(g,w,h)=>{g.fillStyle='#f6f6f6';g.fillRect(0,0,w,h);g.fillStyle='#0E5E57';g.font='600 140px Fira';g.textAlign='center';g.fillText('Инвиреп',w/2,190);
  g.fillStyle='#4b5563';g.font='600 34px Fira';g.fillText('Противовирусное и',w/2,270);g.fillText('иммуномодулирующее средство',w/2,312);drawHand(g,w/2,500,2.4,-.25);
  g.fillStyle='#222';g.font='600 52px Fira';g.fillText('30мл',w/2,690);g.fillStyle='#0E5E57';g.font='600 40px Fira';g.fillText('SPRING PHARMACEUTIC',w/2+20,880)})}
const BOX=boxTex();
function vgrad(top,bot,mid){return canvasTex(8,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,top);if(mid)gr.addColorStop(.62,mid);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,w,h)})}
const RAIN=canvasTex(1024,1024,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#0c1a33');gr.addColorStop(1,'#1d3352');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){const x=rnd(i)*w,y=420+rnd(i+9)*400,r=50+rnd(i+3)*110;const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(230,170,40,${.5+rnd(i+5)*.3})`);rg.addColorStop(1,'rgba(230,170,40,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,2*r,2*r)}
  for(let i=0;i<70;i++){g.fillStyle=`rgba(255,230,170,${.4+rnd(i+20)*.6})`;g.beginPath();g.arc(rnd(i+30)*w,820+rnd(i+40)*180,2+rnd(i+50)*4,0,7);g.fill()}
  g.strokeStyle='rgba(200,220,255,.25)';g.lineWidth=2;for(let i=0;i<260;i++){const x=rnd(i+60)*w,y=rnd(i+70)*h;g.beginPath();g.moveTo(x,y);g.lineTo(x-8,y+40);g.stroke()}});
const PLATE=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#fff';g.beginPath();g.arc(128,128,126,0,7);g.fill();g.strokeStyle='#1d3f9a';g.lineWidth=14;g.beginPath();g.arc(128,128,112,0,7);g.stroke();
  g.fillStyle='#1d3f9a';for(let i=0;i<8;i++){const a=i/8*Math.PI*2;g.beginPath();g.ellipse(128+Math.cos(a)*62,128+Math.sin(a)*62,14,22,a,0,7);g.fill()}g.beginPath();g.arc(128,128,20,0,7);g.fill()});
const GLOW=canvasTex(512,512,(g,w,h)=>{const rg=g.createRadialGradient(256,256,0,256,256,256);rg.addColorStop(0,'rgba(242,167,195,.75)');rg.addColorStop(1,'rgba(242,167,195,0)');g.fillStyle=rg;g.fillRect(0,0,w,h)});
const CLOCK=canvasTex(256,256,(g)=>{g.fillStyle='#fff';g.beginPath();g.arc(128,128,124,0,7);g.fill();g.strokeStyle='#0E5E57';g.lineWidth=10;g.stroke();g.fillStyle='#222';for(let i=0;i<12;i++){const a=i/12*Math.PI*2;g.fillRect(128+Math.cos(a)*100-4,128+Math.sin(a)*100-4,8,8)}
  g.strokeStyle='#222';g.lineWidth=8;g.beginPath();g.moveTo(128,128);g.lineTo(128,60);g.moveTo(128,128);g.lineTo(175,150);g.stroke()});

// ---------------------------------------------------------------- materials & helpers
const M=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:o.r??.55,metalness:o.m??0,transparent:o.op!==undefined,opacity:o.op??1,emissive:o.e??0x000000,emissiveIntensity:o.ei??1,map:o.map??null,side:o.side??THREE.FrontSide});
function mesh(geo,mat,x=0,y=0,z=0,sh=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=sh;m.receiveShadow=true;return m}
function limb(a,b,r,mat){const d=b.clone().sub(a),len=d.length();const m=mesh(new THREE.CapsuleGeometry(r,len,6,12),mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return m}
function smile(r,tube,mat){const m=new THREE.Mesh(new THREE.TorusGeometry(r,tube,8,24,Math.PI),mat);m.rotation.z=Math.PI;return m}

// ---------------------------------------------------------------- HERO
function makeHero(){
  const g=new THREE.Group(),root=new THREE.Group();g.add(root);
  const glass=M(C.amber,{r:.12,m:.1,op:.93}),liquid=M(C.green,{r:.3,e:0x14a06e,ei:0}),pinkM=M(C.pink,{r:.75}),whiteM=M(0xffffff,{r:.5}),dark=M(0x1a120e,{r:.4});
  const prof=[[0,0],[.19,0],[.215,.02],[.22,.05],[.22,.37],[.205,.44],[.14,.5],[.105,.52],[.1,.56],[0,.56]].map(p=>new THREE.Vector2(p[0],p[1]));
  const body=mesh(new THREE.LatheGeometry(prof,48),glass,0,.25,0);root.add(body);
  const liq=mesh(new THREE.CylinderGeometry(.195,.195,.34,32),liquid,0,.25+.2,0,false);root.add(liq);
  const lab=mesh(new THREE.CylinderGeometry(.2235,.2235,.27,64,1,true,-Math.PI*.62,Math.PI*1.24),M(0xffffff,{map:LABEL,r:.7}),0,.25+.2,0);root.add(lab);
  const collar=mesh(new THREE.CylinderGeometry(.13,.13,.05,40),whiteM,0,.83,0);root.add(collar);
  const capM=M(0xffffff,{map:RIBS,r:.6});const cap=mesh(new THREE.CylinderGeometry(.145,.145,.2,48),capM,0,.95,0);root.add(cap);
  const top=mesh(new THREE.CylinderGeometry(.14,.145,.012,48),whiteM,0,1.055,0);root.add(top);
  // face
  const face=new THREE.Group();face.position.set(0,.95,0);root.add(face);
  const eyes=[];for(const s of[-1,1]){const e=new THREE.Group();e.position.set(s*.052,.01,.128);const w=mesh(new THREE.SphereGeometry(.036,24,16),whiteM);w.scale.z=.55;const p=mesh(new THREE.SphereGeometry(.021,16,12),dark,0,-.004,.016);const hl=mesh(new THREE.SphereGeometry(.007,8,8),whiteM,.007,.004,.027);e.add(w,p,hl);face.add(e);eyes.push(e)
    const br=mesh(new THREE.BoxGeometry(.06,.013,.012),dark,s*.052,.06,.13);br.rotation.z=-s*.18;face.add(br);
    const ck=mesh(new THREE.SphereGeometry(.022,12,8),M(0xF49AB9,{r:.8}),s*.085,-.035,.112);ck.scale.z=.3;face.add(ck)}
  const mouth=smile(.032,.008,M(0x5a1a1a));mouth.position.set(0,-.045,.142);face.add(mouth);
  // arms (pivot at shoulder) and legs (pivot at hip)
  const armMat=M(0x8a3a12,{r:.2,op:.95});
  function arm(s){const p=new THREE.Group();p.position.set(s*.205,.66,0);const up=mesh(new THREE.CapsuleGeometry(.032,.2,6,12),armMat,0,-.12,0);const hand=mesh(new THREE.SphereGeometry(.055,20,14),pinkM,0,-.27,0);
    const thumb=mesh(new THREE.CapsuleGeometry(.016,.04,4,8),pinkM,s*-.04,-.24,.02);thumb.rotation.z=s*.6;p.add(up,hand,thumb);root.add(p);return p}
  function leg(s){const p=new THREE.Group();p.position.set(s*.09,.27,0);const l=mesh(new THREE.CapsuleGeometry(.036,.15,6,12),armMat,0,-.1,0);const shoe=mesh(new THREE.BoxGeometry(.105,.07,.16),whiteM,0,-.22,.025);
    const toe=mesh(new THREE.SphereGeometry(.053,16,10),whiteM,0,-.215,.1);toe.scale.y=.7;p.add(l,shoe,toe);root.add(p);return p}
  const armL=arm(-1),armR=arm(1),legL=leg(-1),legR=leg(1);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  return {g,root,eyes,mouth,armL,armR,legL,legR,liquid,glass,
    pose(o={}){armL.rotation.set(o.lx||0,0,o.lz??-.25);armR.rotation.set(o.rx||0,0,o.rz??.25);legL.rotation.x=o.ll||0;legR.rotation.x=o.lr||0;
      for(const[i,e]of eyes.entries()){const b=i===0?(o.blinkL??o.blink??0):(o.blinkR??o.blink??0);e.scale.y=1-.9*b}liquid.emissiveIntensity=o.glow||0}};
}
const blinkAt=(t,ts)=>Math.max(0,...ts.map(b=>{const d=t-b;return d>0&&d<.14?Math.sin(d/.14*Math.PI):0}));

// ---------------------------------------------------------------- HUMAN (blockout, ~6.8 units tall when standing)
function makeHuman(o){const g=new THREE.Group();const skin=M(o.skin,{r:.7}),coat=M(o.coat??0xffffff,{r:.65}),hair=M(o.hairC??C.hair,{r:.8}),dark=M(0x161616,{r:.4});
  const torso=mesh(new THREE.CylinderGeometry(.78,.92,2.7,32),coat,0,3.55,0);g.add(torso);
  const sh=mesh(new THREE.SphereGeometry(.78,32,16,0,Math.PI*2,0,Math.PI/2),coat,0,4.9,0);sh.scale.y=.45;g.add(sh);
  if(o.inner!==undefined){const v=new THREE.Shape();v.moveTo(-.32,0);v.lineTo(.32,0);v.lineTo(0,-.9);v.closePath();const vm=mesh(new THREE.ShapeGeometry(v),M(o.inner),0,5.02,.79,false);vm.rotation.x=-.12;g.add(vm)}
  if(o.tie){const ti=mesh(new THREE.BoxGeometry(.14,.85,.04),M(0x0B4A45),0,4.55,.82);g.add(ti)}
  if(o.badge!==undefined){g.add(mesh(new THREE.BoxGeometry(.45,.16,.04),M(o.badge,{r:.4}),-.42,4.35,.8))}
  g.add(mesh(new THREE.CylinderGeometry(.22,.25,.5,20),skin,0,5.15,0));
  const head=new THREE.Group();head.position.set(0,5.85,0);g.add(head);
  const hd=mesh(new THREE.SphereGeometry(.6,32,24),skin);hd.scale.set(.92,1.08,.95);head.add(hd);
  for(const s of[-1,1]){head.add(mesh(new THREE.SphereGeometry(.12,12,10),skin,s*.56,-.02,0));
    const e=mesh(new THREE.SphereGeometry(.065,14,10),dark,s*.2,.06,.52);e.scale.z=.5;head.add(e);
    const br=mesh(new THREE.BoxGeometry(.2,.04,.04),hair,s*.2,.22,.53);br.rotation.z=-s*.1;head.add(br);
    if(o.glasses){const gl=mesh(new THREE.TorusGeometry(.13,.02,8,24),dark,s*.2,.06,.57);gl.scale.x=1.15;head.add(gl)}
    if(o.earrings)head.add(mesh(new THREE.SphereGeometry(.05,10,8),M(0xE5B84A,{m:.6,r:.3}),s*.58,-.2,.02))}
  if(o.glasses)head.add(mesh(new THREE.BoxGeometry(.1,.02,.02),dark,0,.07,.6));
  head.add(mesh(new THREE.SphereGeometry(.07,12,10),skin,0,-.08,.58));
  const mouth=smile(.13,.025,M(o.female?0xC7506F:0x6B2F2F));mouth.position.set(0,-.25,.52);head.add(mouth);
  const hairCap=mesh(new THREE.SphereGeometry(.64,32,16,0,Math.PI*2,0,Math.PI*.42),hair);hairCap.position.set(0,.05,-.04);hairCap.rotation.x=-.25;head.add(hairCap);
  if(o.female){head.add(mesh(new THREE.SphereGeometry(.3,20,14),hair,0,.5,-.3));const back=mesh(new THREE.SphereGeometry(.62,24,16),hair,0,0,-.12);back.scale.set(.95,1.02,.9);head.add(back)}
  if(o.beard){const bd=mesh(new THREE.SphereGeometry(.6,32,16,0,Math.PI*2,Math.PI*.52,Math.PI*.45),hair);bd.scale.set(.94,1.08,.98);bd.position.z=.02;head.add(bd);
    const mus=mesh(new THREE.CapsuleGeometry(.04,.22,4,8),hair,0,-.17,.55);mus.rotation.z=Math.PI/2;head.add(mus);mouth.position.z=.6}
  if(o.stetho){const st=mesh(new THREE.TorusGeometry(.62,.045,8,32,Math.PI*1.1),M(0x5B6470,{r:.3,m:.3}),0,4.95,.15);st.rotation.set(Math.PI/2-.3,0,Math.PI*.95);g.add(st);
    g.add(mesh(new THREE.CylinderGeometry(.14,.14,.06,20),M(0x8C96A3,{m:.6,r:.3}),.35,4.1,.86))}
  function arm(s){const p=new THREE.Group();p.position.set(s*.86,4.75,0);const a=mesh(new THREE.CapsuleGeometry(.24,1.6,6,12),coat,0,-.95,0);const h=mesh(new THREE.SphereGeometry(.22,16,12),skin,0,-1.95,0);p.add(a,h);g.add(p);p.rotation.z=s*.12;return p}
  return {g,head,mouth,armL:arm(-1),armR:arm(1)}}

// ---------------------------------------------------------------- lights helper
function lights(scene,o){const hemi=new THREE.HemisphereLight(o.sky??0xffffff,o.ground??0x444444,o.hi??.6);scene.add(hemi);
  const d=new THREE.DirectionalLight(o.key??0xffffff,o.ki??2.2);d.position.set(...(o.kp??[3,6,4]));d.castShadow=true;d.shadow.mapSize.set(2048,2048);const s=o.ss??4;Object.assign(d.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:.1,far:60});d.shadow.bias=-.0004;d.target.position.set(...(o.kt??[0,0,0]));scene.add(d,d.target);
  if(o.rim){const r=new THREE.DirectionalLight(o.rim,o.ri??1.2);r.position.set(...(o.rp??[-3,3,-4]));scene.add(r)}
  return d}
function look(p,tg){cam.position.copy(p);cam.lookAt(tg);cam.updateProjectionMatrix()}
const shake=(t,a)=>V(Math.sin(t*7.1)*a+Math.sin(t*13.3)*a*.4,Math.sin(t*6.3+1)*a*.8,0);

// ================================================================= SHOTS
const S=[];
// ---- SHOT 1: drop into piyola, dive into water
{const sc=new THREE.Scene();sc.background=new THREE.Color(0x050608);
  lights(sc,{hi:.7,ki:1.6,kp:[2,5,4],rim:0xbfe3ff,ri:3,rp:[-1,2,-4],ss:3});
  const sp=new THREE.SpotLight(0xffffff,40,12,.5,.6);sp.position.set(0,5,-2);sc.add(sp,sp.target);
  const prof=[[0,0],[.42,0],[.45,.04],[.5,.12],[.78,.5],[.9,.72],[.92,.74],[.86,.74],[.74,.52],[.44,.14],[0,.12]].map(p=>new THREE.Vector2(p[0],p[1]));
  const cup=mesh(new THREE.LatheGeometry(prof,64),new THREE.MeshStandardMaterial({map:PIYOLA,roughness:.25,side:THREE.DoubleSide}));sc.add(cup);
  const water=mesh(new THREE.CircleGeometry(.84,64),M(0x86c6ff,{r:.03,op:.75}),0,.62,0,false);water.rotation.x=-Math.PI/2;sc.add(water);
  const floor=mesh(new THREE.PlaneGeometry(20,20),M(0x0b0c10,{r:.9}),0,0,0,false);floor.rotation.x=-Math.PI/2;sc.add(floor);
  const dropM=M(0x0f6b48,{r:.05,e:0x1aa36f,ei:.6});const drop=mesh(new THREE.SphereGeometry(.075,32,24),dropM);sc.add(drop);
  const crown=[];for(let i=0;i<16;i++){const m=mesh(new THREE.SphereGeometry(.03,12,8),M(0xbfe6ff,{r:.05,op:.9}));sc.add(m);crown.push(m)}
  const col=mesh(new THREE.SphereGeometry(.05,16,12),M(0xbfe6ff,{r:.05,op:.9}));sc.add(col);
  const ring=mesh(new THREE.TorusGeometry(1,.012,8,64),M(0xdff3ff,{op:.8}),0,.625,0,false);ring.rotation.x=Math.PI/2;sc.add(ring);
  S.push({sc,update(u){const tHit=1.15;
    const k=E.in(P(u,0,tHit));drop.visible=u<tHit;drop.position.set(0,lerp(2.3,.66,k),0);drop.scale.set(1,1+.6*k,1);
    const d=u-tHit;for(const[i,m]of crown.entries()){const a=i/16*Math.PI*2;m.visible=d>0&&d<.9;const r=.08+d*.55,y=.62+Math.max(0,d*1.4-d*d*2.6);m.position.set(Math.cos(a)*r,y,Math.sin(a)*r);m.scale.setScalar(1-d)}
    col.visible=d>.15&&d<1;const cd=d-.15;col.position.set(0,.62+Math.max(0,cd*1.6-cd*cd*2.2),0);
    ring.visible=d>0;ring.scale.setScalar(.05+d*.7);ring.material.opacity=clamp(.8-d*.5);
    water.position.y=.62+(d>0?.01*Math.sin(d*30)*Math.exp(-d*3):0);
    const dive=E.io(P(u,1.85,1.15));const p=V(lerp(0,0,dive),lerp(.95,.64,dive),lerp(2.1,.001,dive)).add(V(0,0,0));const tg=V(0,lerp(.68,.62,dive),lerp(0,-.0,dive));
    const q=E.io(P(u,1.75,.8));p.set(0,lerp(lerp(1.5,1.25,u/1.75),2.0,q),lerp(lerp(3.6,3.0,u/1.75),.25,q));if(u>2.55){const r=E.in(P(u,2.55,.45));p.set(0,lerp(2.0,.64,r),lerp(.25,.01,r))}
    look(p.add(shake(u,.004)),V(0,lerp(.95,.62,q),0))}})}

// ---- SHOT 2: dew drop on grass -> drone rise over sunrise meadow
